<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="x-bit Proton" />

    <title>x-bit · Proton</title>
    <meta name="description" content="x-bit Proton — Disha AI chat: rank prediction, college prediction, priority list matching." />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <style>
        /* ── reset & variables ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            color-scheme: dark;
            --bg: #000;
            --surface: #0a0a0a;
            --surface-2: #111;
            --surface-3: #161616;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --border-focus: rgba(255, 255, 255, 0.5);
            --text-0: #fff;
            --text-1: #e8e8e8;
            --text-2: #8a8a8a;
            --text-3: #454545;
            --accent: #fff;
            --danger: #ff453a;
            --success: #30d158;
            --warning: #ff9f0a;
            --font-d: 'Space Grotesk', sans-serif;
            --font-m: 'DM Mono', monospace;
            --r: 16px;
            --r-sm: 12px;
            --r-xs: 8px;
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f4f6;
            --surface: #fff;
            --surface-2: #f0f0f2;
            --surface-3: #e9e9ec;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.16);
            --border-focus: rgba(0, 0, 0, 0.5);
            --text-0: #0a0a0a;
            --text-1: #1c1c1e;
            --text-2: #6b6b6f;
            --text-3: #a2a2a6;
        }
        html {
            height: 100%;
        }
        body {
            background: var(--bg);
            color: var(--text-1);
            font-family: var(--font-d);
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            transition: background .3s, color .3s;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* ── top bar ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: .85rem;
            transition: .2s;
        }
        .icon-btn:hover {
            border-color: var(--border-strong);
        }
        .topbar-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-title img {
            height: 22px;
            width: auto;
            display: block;
        }
        .topbar-title .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: .6;
        }
        .topbar-title span {
            font-weight: 700;
            font-size: .92rem;
            letter-spacing: -0.02em;
        }

        /* ── chat area ── */
        .chat-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 12px;
            scroll-behavior: smooth;
        }
        .chat-wrap::-webkit-scrollbar {
            width: 4px;
        }
        .chat-wrap::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }

        .empty-hero {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding-bottom: 10vh;
        }
        .empty-hero img {
            width: 72px;
            height: 72px;
            opacity: .92;
        }
        .empty-hero .eh-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-0);
        }
        .empty-hero .eh-sub {
            font-family: var(--font-m);
            font-size: .7rem;
            color: var(--text-3);
            letter-spacing: .05em;
        }

        .msg-row {
            display: flex;
            margin-bottom: 14px;
            animation: msgIn .25s cubic-bezier(.16, 1, .3, 1) both;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-row.user {
            justify-content: flex-end;
        }
        .msg-bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: var(--r-sm);
            font-size: .86rem;
            line-height: 1.55;
        }
        .msg-row.user .msg-bubble {
            background: var(--text-0);
            color: var(--bg);
            border-bottom-right-radius: 4px;
        }
        .msg-row.assistant .msg-bubble {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            max-width: 92%;
        }
        .msg-row.assistant {
            flex-direction: column;
            align-items: flex-start;
        }
        .msg-tag {
            font-family: var(--font-m);
            font-size: .5rem;
            color: var(--text-3);
            letter-spacing: .15em;
            text-transform: uppercase;
            margin: 0 2px 5px;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .mini-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            padding: 7px 13px;
            font-family: var(--font-m);
            font-size: .62rem;
            color: var(--text-1);
            cursor: pointer;
            transition: .2s;
            letter-spacing: .03em;
        }
        .mini-chip:hover {
            background: var(--text-0);
            color: var(--bg);
            border-color: var(--text-0);
        }
        .mini-chip i {
            font-size: .6rem;
        }

        /* ── card styles ── */
        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 18px;
            margin-top: 4px;
            width: 100%;
            max-width: 420px;
        }
        .chat-card-title {
            font-size: .82rem;
            font-weight: 700;
            color: var(--text-0);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }
        .mode-tabs {
            display: flex;
            gap: 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px;
            margin-bottom: 14px;
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 7px 4px;
            border-radius: 16px;
            font-family: var(--font-m);
            font-size: .6rem;
            letter-spacing: .05em;
            color: var(--text-2);
            cursor: pointer;
            transition: .2s;
        }
        .mode-tab.active {
            background: var(--text-0);
            color: var(--bg);
            font-weight: 600;
        }
        .field-mini-label {
            font-family: var(--font-m);
            font-size: .55rem;
            color: var(--text-3);
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .subj-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .subj-input {
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            padding: 10px 6px;
        }
        .xin {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-xs);
            padding: 11px 13px;
            color: var(--text-0);
            font-family: var(--font-d);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: .2s;
        }
        .xin:focus {
            border-color: var(--border-focus);
        }
        .xin::placeholder {
            color: var(--text-3);
        }
        .field-block {
            margin-bottom: 12px;
        }
        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 14px 0;
        }
        .btn-solid {
            width: 100%;
            background: var(--text-0);
            color: var(--bg);
            border: none;
            border-radius: var(--r-xs);
            padding: 13px;
            font-family: var(--font-d);
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
            margin-top: 6px;
        }
        .btn-solid:hover {
            opacity: .88;
        }
        .btn-solid:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        .btn-ghost {
            width: 100%;
            background: transparent;
            color: var(--text-1);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-xs);
            padding: 11px;
            font-family: var(--font-m);
            font-size: .65rem;
            letter-spacing: .06em;
            cursor: pointer;
            transition: .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-ghost:hover {
            border-color: var(--text-0);
        }
        .link-hint {
            font-family: var(--font-m);
            font-size: .62rem;
            color: var(--text-2);
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .link-hint:hover {
            color: var(--text-0);
        }

        .rank-result {
            text-align: center;
            padding: 8px 0 4px;
        }
        .rank-result .rr-label {
            font-family: var(--font-m);
            font-size: .55rem;
            color: var(--text-3);
            letter-spacing: .15em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .rank-result .rr-value {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-0);
            line-height: 1;
            margin-bottom: 10px;
        }
        .rr-meta {
            font-family: var(--font-m);
            font-size: .62rem;
            color: var(--text-2);
            margin-bottom: 14px;
        }

        .dd-mini {
            position: relative;
        }
        .dd-mini-trigger {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-xs);
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: .83rem;
            font-weight: 500;
            color: var(--text-0);
            transition: .2s;
        }
        .dd-mini-trigger.placeholder {
            color: var(--text-3);
        }
        .dd-mini-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-xs);
            z-index: 50;
            display: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .dd-mini-menu.show {
            display: block;
        }
        .dd-mini-item {
            padding: 10px 13px;
            font-size: .76rem;
            color: var(--text-2);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .dd-mini-item:last-child {
            border-bottom: none;
        }
        .dd-mini-item:hover {
            background: var(--surface-2);
            color: var(--text-0);
        }

        .college-result-card {
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 13px 14px;
            margin-bottom: 8px;
            background: var(--surface-2);
        }
        .crc-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
        }
        .crc-name {
            font-size: .78rem;
            font-weight: 700;
            color: var(--text-0);
            line-height: 1.35;
        }
        .crc-cutoff {
            font-family: var(--font-m);
            font-size: .72rem;
            font-weight: 600;
            color: var(--text-1);
            flex-shrink: 0;
            white-space: nowrap;
        }
        .crc-meta {
            font-family: var(--font-m);
            font-size: .58rem;
            color: var(--text-3);
        }

        .upload-dz {
            border: 1.5px dashed var(--border-strong);
            border-radius: var(--r-sm);
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            transition: .2s;
            position: relative;
        }
        .upload-dz:hover {
            border-color: var(--text-0);
            background: var(--surface-2);
        }
        .upload-dz input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-dz i {
            font-size: 1.1rem;
            color: var(--text-2);
            margin-bottom: 8px;
            display: block;
        }
        .upload-dz span {
            font-size: .72rem;
            color: var(--text-2);
        }

        .loading-badge {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            touch-action: none;
        }
        .loading-badge iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            touch-action: none;
            background: transparent;
        }
        .loading-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .shine-text {
            background: linear-gradient(90deg, var(--text-3) 0%, var(--text-0) 50%, var(--text-3) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shineSweep 1.3s linear infinite;
        }
        @keyframes shineSweep {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ── sidebar ── */
        .sb-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
        }
        .sb-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 401;
            transition: left .35s cubic-bezier(.16, 1, .3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar.open {
            left: 0;
        }
        .sb-top {
            padding: calc(20px + env(safe-area-inset-top)) 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .sb-blob {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--text-0);
            color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .sb-name {
            font-size: .88rem;
            font-weight: 700;
            color: var(--text-0);
        }
        .sb-tag {
            font-family: var(--font-m);
            font-size: .55rem;
            color: var(--text-3);
            margin-top: 3px;
            letter-spacing: .08em;
        }
        .sb-newchat {
            margin: 14px 18px 6px;
            padding: 11px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r-xs);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-family: var(--font-m);
            font-size: .65rem;
            letter-spacing: .06em;
            color: var(--text-1);
            transition: .2s;
            flex-shrink: 0;
        }
        .sb-newchat:hover {
            background: var(--text-0);
            color: var(--bg);
            border-color: var(--text-0);
        }
        .sb-section-label {
            font-family: var(--font-m);
            font-size: .52rem;
            color: var(--text-3);
            letter-spacing: .15em;
            text-transform: uppercase;
            padding: 14px 18px 6px;
            flex-shrink: 0;
        }
        .sb-recent {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
            min-height: 0;
        }
        .sb-recent-item {
            padding: 10px 10px;
            border-radius: var(--r-xs);
            cursor: pointer;
            transition: .15s;
            margin-bottom: 2px;
        }
        .sb-recent-item:hover {
            background: var(--surface-2);
        }
        .sb-recent-item .rt-title {
            font-size: .75rem;
            font-weight: 600;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sb-recent-item .rt-sub {
            font-family: var(--font-m);
            font-size: .55rem;
            color: var(--text-3);
            margin-top: 2px;
        }
        .sb-empty {
            padding: 20px 18px;
            font-family: var(--font-m);
            font-size: .6rem;
            color: var(--text-3);
            text-align: center;
        }
        .sb-footer {
            border-top: 1px solid var(--border);
            padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
            flex-shrink: 0;
            background: var(--surface);
        }
        .sb-dark-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sb-dark-label {
            font-size: .75rem;
            font-weight: 700;
            color: var(--text-0);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-pill {
            position: relative;
            width: 44px;
            height: 25px;
            flex-shrink: 0;
        }
        .toggle-pill input {
            display: none;
        }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            cursor: pointer;
            transition: .25s;
        }
        .toggle-track::before {
            content: '';
            position: absolute;
            width: 19px;
            height: 19px;
            left: 2px;
            top: 2px;
            background: var(--text-0);
            border-radius: 50%;
            transition: .25s cubic-bezier(.16, 1, .3, 1);
        }
        .toggle-pill input:checked+.toggle-track::before {
            transform: translateX(19px);
            background: var(--bg);
        }
        .toggle-pill input:checked+.toggle-track {
            background: var(--text-0);
        }

        /* ── onboard ── */
        .onboard-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .97);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .onboard-overlay.hidden {
            display: none;
        }
        .onboard-card {
            width: 88%;
            max-width: 340px;
            border: 1px solid var(--border-strong);
            border-radius: var(--r);
            background: var(--surface);
            padding: 38px 28px;
            animation: msgIn .35s cubic-bezier(.16, 1, .3, 1) both;
        }
        .onboard-eyebrow {
            font-family: var(--font-m);
            font-size: .58rem;
            color: var(--text-3);
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .onboard-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-0);
            letter-spacing: -0.03em;
            margin-bottom: 26px;
            line-height: 1.2;
        }
        .onboard-card h2 span {
            color: var(--text-3);
        }
        .onboard-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-strong);
            padding: 10px 0;
            color: var(--text-0);
            font-family: var(--font-d);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            margin-bottom: 26px;
        }
        .onboard-input:focus {
            border-color: var(--text-0);
        }
        .onboard-btn {
            width: 100%;
            background: var(--text-0);
            color: var(--bg);
            border: none;
            border-radius: var(--r-xs);
            padding: 13px;
            font-family: var(--font-d);
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .onboard-btn:disabled {

        .dl-toast {

            <div class="composer-actions">
                <button class="comp-icon-btn"><i class="fa-solid fa-microphone"></i></button>
                <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
            </div>

    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════════
           DEEP LINK — open native Android app (com.proton.v1_1_1)
           Runs immediately on page load, before anything else.
           ═══════════════════════════════════════════════════════════════════ */
        (function deepLinkToApp() {
            // ── only on Android ──
            if (!/android/i.test(navigator.userAgent)) return;

            // ── skip if already in PWA standalone mode (app is already open) ──
            if (window.matchMedia('(display-mode: standalone)').matches) return;

            // ── skip if we've already tried in this session ──
            if (sessionStorage.getItem('xbit_dl_tried') === 'true') return;

            // ── skip if we were redirected back from the app (prevents loops) ──
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('xbit_web') === '1') return;

            // ── your app's package name ──
            var PACKAGE = 'com.proton.v1_1_1';

            // ── build the current URL without the xbit_web param ──
            var currentUrl = window.location.href.split('?')[0];
            var currentSearch = window.location.search;
            var currentHash = window.location.hash || '';

            // ── fallback URL: same page with ?xbit_web=1 to prevent loops ──
            var fallbackUrl = currentUrl + '?xbit_web=1' +
                (currentSearch ? '&' + currentSearch.replace(/^\?/, '') : '') +
                currentHash;

            // ── Android intent URL (works on Chrome + most Android browsers) ──
            var intentUrl =
                'intent://' +
                window.location.host +
                window.location.pathname +
                window.location.search +
                window.location.hash +
                '#Intent;' +
                'package=' + PACKAGE + ';' +
                'S.browser_fallback_url=' + encodeURIComponent(fallbackUrl) + ';' +
                'end;';

            // ── mark that we've attempted (prevents repeated attempts) ──
            sessionStorage.setItem('xbit_dl_tried', 'true');

            // ── show a subtle toast ──
            var toast = document.getElementById('dlToast');
            if (toast) {
                toast.textContent = 'Opening Proton app …';
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 4000);
            }

            // ── use a timeout to detect if the app didn't open ──
            var timeoutId = setTimeout(function() {
                // If we're still here after 2.8s, the app probably isn't installed.
                // Redirect to the fallback URL (which has ?xbit_web=1).
                window.location.href = fallbackUrl;
            }, 2800);

            // ── if the page goes into the background (app opened), clear the timeout ──
            function onVisibilityChange() {
                if (document.hidden) {
                    clearTimeout(timeoutId);
                    document.removeEventListener('visibilitychange', onVisibilityChange);
                }
            }
            document.addEventListener('visibilitychange', onVisibilityChange);

            // ── finally, navigate to the intent ──
            window.location.href = intentUrl;
        })();


        /* ═══════════════════════════════════════════════════════════════════
           The rest of your app logic (rank predictor, chat, etc.)
           ═══════════════════════════════════════════════════════════════════ */
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        var GENERAL_CATEGORIES = ['1G', '1K', '1R', '2AG', '2AK', '2AR', '2BG', '2BK', '2BR', '3AG', '3AK', '3AR', '3BG',
            '3BK', '3BR', 'GM', 'GMK', 'GMP', 'GMR', 'NRI', 'OPN', 'OTH', 'S1G', 'S1K', 'S1R', 'S2G', 'S2K', 'S2R', 'S3G',
            'S3K', 'S3R', 'S4G', 'S4K', 'S4R', 'STG', 'STK', 'STR'
        ];
        var HK_CATEGORIES = ['1H', '1KH', '1RH', '2AH', '2AKH', '2ARH', '2BH', '2BKH', '2BRH', '3AH', '3AKH', '3ARH', '3BH',
            '3BKH', '3BRH', 'GMH', 'GMKH', 'GMPH', 'GMRH', 'S1H', 'S1KH', 'S1RH', 'S2H', 'S2KH', 'S2RH', 'S3H', 'S3KH',
            'S3RH', 'S4H', 'S4KH', 'S4RH', 'STH', 'STKH', 'STRH'
        ];

        var LS = {
            get: function(k, d) { try { var v = localStorage.getItem('xbit_' + k); return v !== null ? JSON.parse(v) :
                    d; } catch (_) { return d; } },
            set: function(k, v) { try { localStorage.setItem('xbit_' + k, JSON.stringify(v)); } catch (_) {} }
        };

        function getPromoHTML() {
            return '<div class="promo-banner">' +
                '<span class="promo-text"><span class="emoji">🚀</span> x-bit KEA 2.0 is now available — download the app!</span>' +
                '<a href="./proton-debug.apk" download class="promo-dl"><i class="fa-solid fa-download"></i> Download App</a>' +
                '</div>';
        }

        /* ── onboard ── */
        var userName = LS.get('username', '');

        function initOnboarding() {
            var modal = document.getElementById('onboardModal');
            if (userName) { modal.classList.add('hidden');
                applyIdentity(); return; }
            var input = document.getElementById('onboardNameInput');
            var btn = document.getElementById('onboardSubmitBtn');
            input.addEventListener('input', function() { btn.disabled = input.value.trim().length === 0; });
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && input.value.trim()) submit(); });
            btn.addEventListener('click', submit);

            function submit() {
                var name = input.value.trim();
                if (!name) return;
                userName = name;
                LS.set('username', name);
                modal.classList.add('hidden');
                applyIdentity();
            }
            setTimeout(function() { input.focus(); }, 350);
        }

        function applyIdentity() {
            var letter = userName.charAt(0).toUpperCase();
            document.getElementById('sbBlob').textContent = letter;
            document.getElementById('sbName').textContent = userName;
            var hr = new Date().getHours();
            var greet = hr < 12 ? 'good morning' : hr < 17 ? 'good afternoon' : 'good evening';
            document.getElementById('heroGreeting').textContent = 'Hey ' + userName + ', ' + greet;
        }

        /* ── sidebar ── */
        function initSidebar() {
            var sidebar = document.getElementById('sidebar');
            var backdrop = document.getElementById('sbBackdrop');
            document.getElementById('menuBtn').addEventListener('click', function() { sidebar.classList.add('open');
                backdrop.classList.add('open');
                renderRecentChats(); });
            backdrop.addEventListener('click', function() { sidebar.classList.remove('open');
                backdrop.classList.remove('open'); });
            document.getElementById('sbNewChat').addEventListener('click', startNewChat);
            document.getElementById('newChatTopBtn').addEventListener('click', startNewChat);

            var darkToggle = document.getElementById('darkToggle');
            var dark = LS.get('dark_mode', true);

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                darkToggle.checked = dark;
                var logoFile = dark ? './logo.png' : './logo1.png';
                var topbarLogo = document.getElementById('topbarLogo');
                var heroLogo = document.getElementById('heroLogo');
                if (topbarLogo) { topbarLogo.src = logoFile;
                    topbarLogo.style.display = ''; }
                if (heroLogo) { heroLogo.src = logoFile;
                    heroLogo.style.display = ''; }
            }
            applyTheme();
            darkToggle.addEventListener('change', function() { dark = darkToggle.checked;
                LS.set('dark_mode', dark);
                applyTheme(); });
        }

        var currentChatId = null;
        var currentChatMessages = [];

        function startNewChat() {
            saveCurrentChat();
            currentChatId = 'c_' + Date.now();
            currentChatMessages = [];
            document.getElementById('chatBody').innerHTML = '';
            document.getElementById('chatBody').style.display = 'none';
            document.getElementById('emptyHero').style.display = 'flex';
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sbBackdrop').classList.remove('open');
            flowState = null;
        }

        function saveCurrentChat() {
            if (!currentChatId || currentChatMessages.length === 0) return;
            var all = LS.get('chats', {});
            var firstUserMsg = currentChatMessages.find(function(m) { return m.role === 'user'; });
            all[currentChatId] = {
                id: currentChatId,
                title: firstUserMsg ? firstUserMsg.plain.slice(0, 42) : 'New chat',
                updatedAt: Date.now(),
                messages: currentChatMessages
            };
            LS.set('chats', all);
        }
        var recentChatsExpanded = false;
        var RECENT_CHATS_CAP = 5;

        function renderRecentChats() {
            var container = document.getElementById('sbRecent');
            var all = LS.get('chats', {});
            var list = Object.values(all).sort(function(a, b) { return b.updatedAt - a.updatedAt; });
            if (!list.length) { container.innerHTML = '<div class="sb-empty">No chats yet</div>'; return; }
            var shown = recentChatsExpanded ? list : list.slice(0, RECENT_CHATS_CAP);
            container.innerHTML = shown.map(function(c) {
                var date = new Date(c.updatedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                return '<div class="sb-recent-item" data-id="' + c.id + '"><div class="rt-title">' + escapeHtml(c
                    .title || 'New chat') + '</div><div class="rt-sub">' + date + '</div></div>';
            }).join('');
            if (list.length > RECENT_CHATS_CAP) {
                container.innerHTML +=
                    '<div class="sb-recent-item" id="sbShowMoreBtn" style="text-align:center;"><span class="link-hint">' +
                    (recentChatsExpanded ? 'Show less' : 'Show more (+' + (list.length - RECENT_CHATS_CAP) +
                    ')') + '</span></div>';
                document.getElementById('sbShowMoreBtn').addEventListener('click', function() { recentChatsExpanded =
                        !recentChatsExpanded;
                    renderRecentChats(); });
            }
            container.querySelectorAll('.sb-recent-item[data-id]').forEach(function(el) {
                var pressTimer = null,
                    longPressed = false;
                var start = function() {
                    longPressed = false;
                    pressTimer = setTimeout(function() {
                        longPressed = true;
                        if (navigator.vibrate) navigator.vibrate(15);
                        if (confirm('Delete this chat? This can\'t be undone.')) deleteChat(el.getAttribute(
                            'data-id'));
                    }, 550);
                };
                var cancel = function() { if (pressTimer) clearTimeout(pressTimer); };
                el.addEventListener('touchstart', start, { passive: true });
                el.addEventListener('touchend', cancel);
                el.addEventListener('touchmove', cancel);
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', cancel);
                el.addEventListener('mouseleave', cancel);
                el.addEventListener('click', function() { if (!longPressed) loadChat(el.getAttribute('data-id')); });
            });
        }

        function deleteChat(id) {
            var all = LS.get('chats', {});
            delete all[id];
            LS.set('chats', all);
            if (id === currentChatId) { startNewChat(); }
            renderRecentChats();
        }

        function loadChat(id) {
            var all = LS.get('chats', {});
            var chat = all[id];
            if (!chat) return;
            saveCurrentChat();
            currentChatId = chat.id;
            currentChatMessages = chat.messages;
            var body = document.getElementById('chatBody');
            body.innerHTML = '';
            chat.messages.forEach(function(m) { appendRawBubble(m.role, m.html); });
            body.style.display = 'block';
            document.getElementById('emptyHero').style.display = 'none';
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sbBackdrop').classList.remove('open');
            document.getElementById('chatWrap').scrollTop = document.getElementById('chatWrap').scrollHeight;
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>"']/g, function(m) { return ({ '&': '&amp;',
                    '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; }); }

        function loadingLine(text) {
            var theme = document.documentElement.getAttribute('data-theme') || 'dark';
            var loadingFile = theme === 'light' ? './loading1.html' : './loading.html';
            return '<div class="loading-line"><div class="loading-badge"><iframe src="' + loadingFile +
                '" title="loading" tabindex="-1" aria-hidden="true" sandbox="allow-scripts"></iframe></div><span class="shine-text">' +
                escapeHtml(text) + '</span></div>';
        }

        function appendRawBubble(role, html) {
            document.getElementById('emptyHero').style.display = 'none';
            var body = document.getElementById('chatBody');
            body.style.display = 'block';
            var row = document.createElement('div');
            row.className = 'msg-row ' + role;
            if (role === 'assistant') {
                row.innerHTML = '<div class="msg-tag">PROTON</div><div class="msg-bubble">' + html + '</div>';
            } else {
                row.innerHTML = '<div class="msg-bubble">' + html + '</div>';
            }
            body.appendChild(row);
            document.getElementById('chatWrap').scrollTop = document.getElementById('chatWrap').scrollHeight;
            return row;
        }

        function pushMessage(role, html, plain) {
            if (!currentChatId) currentChatId = 'c_' + Date.now();
            currentChatMessages.push({ role: role, html: html, plain: plain || html.replace(/<[^>]+>/g, '').trim(), ts: Date
                    .now() });
            var row = appendRawBubble(role, html);
            saveCurrentChat();
            return row;
        }

        function userSays(text) { pushMessage('user', escapeHtml(text), text); }

        function protonSays(html, plain) { return pushMessage('assistant', html, plain); }

        /* ── rank predictor ── */
        function KCETRankPredictor() {
            this.totalCandidates = 315000;
            this.anchors = [
                { p: 100.0, r: 1 }, { p: 98.50, r: 10 }, { p: 96.00, r: 100 }, { p: 92.50, r: 1000 },
                { p: 88.50, r: 3000 }, { p: 85.00, r: 5500 }, { p: 81.50, r: 9000 }, { p: 77.00, r: 15000 },
                { p: 72.00, r: 25000 }, { p: 65.00, r: 50000 }, { p: 58.00, r: 75000 }, { p: 0.00, r: 315000 }
            ];
            this.formulas = [];
            this._compile();
        }
        KCETRankPredictor.prototype._compile = function() {
            for (var i = 0; i < this.anchors.length - 1; i++) {
                var up = this.anchors[i],
                    lo = this.anchors[i + 1];
                var M = (Math.log(lo.r) - Math.log(up.r)) / (lo.p - up.p);
                var C = Math.log(up.r) - M * up.p;
                this.formulas.push({ maxP: up.p, minP: lo.p, M: M, C: C });
            }
        };
        KCETRankPredictor.prototype.predictRank = function(pct) {
            if (pct >= 100) return 1;
            if (pct <= 0) return this.totalCandidates;
            for (var i = 0; i < this.formulas.length; i++) {
                var f = this.formulas[i];
                if (pct <= f.maxP && pct > f.minP) {
                    var rank = Math.exp(f.M * pct + f.C);
                    var upR = this.anchors.find(function(a) { return a.p === f.maxP; }).r;
                    var loR = this.anchors.find(function(a) { return a.p === f.minP; }).r;
                    return Math.round(Math.max(Math.min(upR, loR), Math.min(Math.max(upR, loR), rank)));
                }
            }
            return this.totalCandidates;
        };
        var kcetEngine = new KCETRankPredictor();

        var branchAliasesCache = null;

        function loadBranchAliases() {
            if (branchAliasesCache) return Promise.resolve(branchAliasesCache);
            return fetch('./branch-aliases.json').then(function(r) { return r.json(); }).then(function(data) {
                branchAliasesCache = data;
                return data;
            });
        }

        function matchBranchKey(aliasList, branchKeys) {
            var keys = Object.keys(branchKeys);
            var candidates = aliasList.map(function(s) { return s.toUpperCase().replace(/[^A-Z0-9\s&]/g, ' ').replace(
                    /\s+/g, ' ').trim(); });
            for (var i = 0; i < keys.length; i++) {
                var nk = keys[i].toUpperCase().replace(/[^A-Z0-9\s&]/g, ' ').replace(/\s+/g, ' ').trim();
                if (candidates.indexOf(nk) !== -1) return keys[i];
            }
            for (var i = 0; i < keys.length; i++) {
                var nk = keys[i].toUpperCase().replace(/[^A-Z0-9\s&]/g, ' ').replace(/\s+/g, ' ').trim();
                for (var j = 0; j < candidates.length; j++) {
                    if (nk.indexOf(candidates[j]) !== -1 || candidates[j].indexOf(nk) !== -1) return keys[i];
                }
            }
            var best = null,
                bestScore = 0;
            for (var i = 0; i < keys.length; i++) {
                var bw = new Set(keys[i].toUpperCase().replace(/[^A-Z0-9\s&]/g, ' ').replace(/\s+/g, ' ').trim().split(
                    ' ').filter(function(w) { return w.length > 1; }));
                for (var j = 0; j < candidates.length; j++) {
                    var cw = new Set(candidates[j].split(' ').filter(function(w) { return w.length > 1; }));
                    var inter = 0;
                    cw.forEach(function(w) { if (bw.has(w)) inter++; });
                    var union = new Set([].concat(Array.from(cw), Array.from(bw))).size;
                    var sc = union ? inter / union : 0;
                    if (sc > bestScore) { bestScore = sc;
                        best = keys[i]; }
                }
            }
            return bestScore >= 0.4 ? best : null;
        }

        var datasetCache = {};

                var script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    var data = window.XOS_CUTOFF || [];
                    datasetCache[which] = data;
                    window.XOS_CUTOFF = undefined;
                    resolve(data);
                };
                script.onerror = function() { reject(new Error('Could not load ' + src)); };
                document.body.appendChild(script);
            });

        function renderCollegeMatches(dataset, category, rank, aliasPool, branchLabel) {
            var lowerBound = rank - 1500;
            var results = [];
            for (var i = 0; i < dataset.length; i++) {
                var college = dataset[i];
                if (!college.branches) continue;
                var key = matchBranchKey(aliasPool, college.branches);
                if (!key) continue;
                var cutoff = college.branches[key][category];
                if (cutoff === null || cutoff === undefined) continue;
                if (cutoff >= lowerBound) {
                    results.push({ id: college.id, name: college.name, location: college.location || 'Karnataka',
                        branch: key, cutoff: cutoff, dist: Math.abs(cutoff - rank) });
                }
            }
            results.sort(function(a, b) { return a.dist - b.dist; });
            if (!results.length) {
                protonSays(
                    '<i class="fa-regular fa-folder-open"></i> No colleges found for <b>' + escapeHtml(
                        branchLabel) + '</b> · ' + category + ' near rank ' + rank.toLocaleString(
                        'en-IN') + '.' + getPromoHTML()
                    );
                return;

            var top5 = results.slice(0, 5);
            var html = '<b>' + results.length +
                '</b> colleges found for <b>' + escapeHtml(branchLabel) + '</b> · ' + category +
                ' near rank ' + rank.toLocaleString('en-IN') + ':<div style="margin-top:10px;">';
            html += top5.map(function(r) { return collegeCardHtml(r, category); }).join('');
            html += '</div>';

                        ' · ' + category, results, category); });

        async function parsePriorityPdf(arrayBuffer) {
            var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            var tokens = [];
            for (var i = 1; i <= pdf.numPages; i++) {
                var page = await pdf.getPage(i);
                var tc = await page.getTextContent();
                tc.items.forEach(function(item) { var s = item.str.trim(); if (s.length) tokens.push(s); });
            }
            var results = [];
            var priorityRe = /^\d+$/,
                codeRe = /^[A-Z]\d{3}[A-Z]{2}$/i;
            var anchors = [];
            for (var i = 0; i < tokens.length - 1; i++) { if (priorityRe.test(tokens[i]) && codeRe.test(tokens[i + 1]))
                    anchors.push(i); }
            for (var a = 0; a < anchors.length; a++) {
                var idx = anchors[a],
                    priority = parseInt(tokens[idx], 10),
                    code = tokens[idx + 1].toUpperCase(),
                    collegeId = code.substring(0, 4);
                var end = a + 1 < anchors.length ? anchors[a + 1] : tokens.length;
                var rawText = tokens.slice(idx + 2, end).join(' ');
                var normalized = rawText.replace(/(\d)\s*,\s*(\d)/g, '$1,$2');
                var branch;
                var feeMatch = normalized.match(/\d{1,3}(?:,\d{2,3})+/);
                if (feeMatch) {
                    var feeInRaw = rawText.match(/\d{1,3}\s*(?:,\s*\d{2,3}\s*)+/);
                    branch = feeInRaw ? rawText.substring(0, feeInRaw.index).trim() : rawText.substring(0, rawText
                        .indexOf(feeMatch[0])).trim();
                } else {
                    var numMatch = rawText.match(/\d{5,}/);
                    branch = numMatch ? rawText.substring(0, numMatch.index).trim() : rawText.trim();
                }
                branch = branch.replace(/[\s\-–—:]+$/, '').replace(/\s+/g, ' ').trim();
                if (branch.length > 0) results.push({ priority: priority, collegeId: collegeId, branch: branch });
            }
            return results;
        }

        function matchPriorityOptions(dataset, options, category, userRank) {
            var map = {};
            dataset.forEach(function(c) { map[c.id] = c; });
            return options.map(function(opt) {
                var college = map[opt.collegeId];
                if (!college) return { priority: opt.priority, collegeId: opt.collegeId, collegeName: null,
                    status: 'no-data', statusLabel: 'College N/A', cutoff: null };
                var mb = matchBranchKey([opt.branch], college.branches);
                if (!mb) return { priority: opt.priority, collegeId: opt.collegeId, collegeName: college.name,
                    status: 'no-data', statusLabel: 'Branch N/A', cutoff: null };
                var cutoff = college.branches[mb][category];
                if (cutoff === null || cutoff === undefined) return { priority: opt.priority, collegeId: opt
                        .collegeId, collegeName: college.name, matchedBranch: mb, status: 'no-seat',
                    statusLabel: 'No Seat', cutoff: null };
                var eligible = cutoff >= userRank;
                return { priority: opt.priority, collegeId: opt.collegeId, collegeName: college.name,
                    matchedBranch: mb, cutoff: cutoff, status: eligible ? 'eligible' : 'not-eligible',
                    statusLabel: eligible ? 'Eligible' : 'Not Eligible' };
            });
        }

        /* ── smart chat ── */
        function normalizeText(s) { return s.toLowerCase().replace(/[^\w\s%.]/g, ' ').replace(/\s+/g, ' ').trim(); }

        function tokenize(s) { return normalizeText(s).split(' ').filter(Boolean); }

        function patternTokens(s) { return normalizeText(s).replace(/\d+\.?\d*/g, '#num#').split(' ').filter(Boolean); }

        function jaccard(a, b) {
            var inter = 0;
            a.forEach(function(t) { if (b.has(t)) inter++; });
            var union = a.size + b.size - inter;
            return union ? inter / union : 0;
        }

        var kcetTrainingSet = [];
        var chatTrainingSet = [];

        function loadTrainingData() {
            fetch('./trainingset.json').then(function(r) { return r.json(); }).then(function(data) {
                kcetTrainingSet = data;
                kcetTrainingSet.forEach(function(ex) { ex._tokens = new Set(patternTokens(ex.input)); });
            }).catch(function() { kcetTrainingSet = []; });
            fetch('./trainingset1.json').then(function(r) { return r.json(); }).then(function(data) {
                chatTrainingSet = data;
                chatTrainingSet.forEach(function(ex) { ex._tokens = new Set(tokenize(ex.input)); });
            }).catch(function() { chatTrainingSet = []; });
        }

        function classifyKcetIntent(text) {
            if (!kcetTrainingSet.length) return null;
            var q = new Set(patternTokens(text));
            var best = null,
                bestScore = 0;
            for (var i = 0; i < kcetTrainingSet.length; i++) {
                var ex = kcetTrainingSet[i];
                var sc = jaccard(q, ex._tokens);
                if (sc > bestScore) { bestScore = sc;
                    best = ex; }
            }
            return best ? { intent: best.output.intent, score: bestScore } : null;
        }

        function classifyChat(text) {
            if (!chatTrainingSet.length) return null;
            var q = new Set(tokenize(text));
            if (!q.size) return null;
            var best = null,
                bestScore = 0;
            for (var i = 0; i < chatTrainingSet.length; i++) {
                var ex = chatTrainingSet[i];
                var sc = jaccard(q, ex._tokens);
                if (sc > bestScore) { bestScore = sc;
                    best = ex; }
            }
            return best && bestScore > 0.3 ? best : null;
        }

        var KARNATAKA_CITIES = ['bangalore', 'bengaluru', 'mysore', 'mysuru', 'mangalore', 'mangaluru', 'hubli', 'hubballi',
            'belgaum', 'belagavi', 'dharwad', 'shimoga', 'shivamogga', 'hassan', 'tumkur', 'tumakuru', 'davangere',
            'bellary', 'ballari', 'gulbarga', 'kalaburagi', 'bidar', 'raichur', 'udupi', 'chikmagalur', 'kolar', 'mandya',
            'chitradurga', 'bagalkot', 'hospet', 'bijapur', 'vijayapura'
        ];
        var BRANCH_SHORTHAND = {
            cse: 'Computer Science and Engineering',
            cs: 'Computer Science and Engineering',
            ise: 'Information Science and Engineering',
            it: 'Information Technology',
            ai: 'Artificial Intelligence',
            'ai/ml': 'Artificial Intelligence and Machine Learning',
            aiml: 'Artificial Intelligence and Machine Learning',
            ml: 'Machine Learning',
            ece: 'Electronics and Communication Engineering',
            eee: 'Electrical & Electronics Engineering',
            mech: 'Mechanical Engineering',
            mechanical: 'Mechanical Engineering',
            civil: 'Civil Engineering',
            chem: 'Chemical Engineering',
            chemical: 'Chemical Engineering',
            aero: 'Aerospace Engineering',
            aeronautical: 'Aeronautical Engineering'
        };
        var ALL_CATEGORY_CODES = GENERAL_CATEGORIES.concat(HK_CATEGORIES).sort(function(a, b) { return b.length - a
            .length; });

        var SUBJ_RE = { physics: /phy(?:sics)?/, chemistry: /chem(?:istry)?/, maths: /math(?:s|ematics)?/ };

        function extractSubjectMarks(segment) {
            var marks = {};
            for (var subj in SUBJ_RE) {
                var re = SUBJ_RE[subj];
                var after = new RegExp(re.source + '\\D{0,4}(\\d{1,3}(?:\\.\\d+)?)', 'i');
                var before = new RegExp('(\\d{1,3}(?:\\.\\d+)?)\\D{0,4}' + re.source, 'i');
                var mm = segment.match(after) || segment.match(before);
                if (mm) marks[subj] = parseFloat(mm[1]);
            }
            if (marks.physics != null && marks.chemistry != null && marks.maths != null) return marks;
            return null;
        }

        function findScoreBlock(text, keywordSrc, maxTotal, subjectMax, ambiguousDefault) {
            var subj = extractSubjectMarks(text);
            if (subj && subj.physics <= subjectMax && subj.chemistry <= subjectMax && subj.maths <= subjectMax) {
                var total = subj.physics + subj.chemistry + subj.maths;
                return { total: total, pct: (total / maxTotal) * 100 };
            }
            var pctMatch = text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)\\s*%', 'i')) ||
                text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*%\\s*(?:in\\s*)?' + keywordSrc, 'i'));
            if (pctMatch) { var v = Math.min(100, parseFloat(pctMatch[1])); return { pct: v, total: (v / 100) *
                        maxTotal }; }
            var explicitMarks = text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*marks?\\s*(?:in\\s*)?' + keywordSrc, 'i')) ||
                text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)\\s*marks', 'i'));
            if (explicitMarks) { var v = parseFloat(explicitMarks[1]); if (v <= maxTotal) return { total: v,
                        pct: (v / maxTotal) * 100 }; }
            var totalMatch = text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)', 'i')) ||
                text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*(?:marks?)?\\s*(?:in\\s*)?' + keywordSrc, 'i'));
            if (totalMatch) {
                var v = parseFloat(totalMatch[1]);
                if (v <= maxTotal) {
                    if (v > 100) { return { total: v, pct: (v / maxTotal) * 100 }; }
                    if (ambiguousDefault === 'marks') return { total: v, pct: (v / maxTotal) * 100 };
                    return { pct: v, total: (v / 100) * maxTotal };
                }
            }
            return null;
        }

        function extractEntities(text) {
            var t = ' ' + text.toLowerCase() + ' ';
            var e = {};
            var boardsResult = findScoreBlock(t, '(?:boards?|2nd\\s*pu|puc?)\\b', 300, 100, 'percentage');
            if (boardsResult) e.boardPercentage = boardsResult.pct;
            var kcetResult = findScoreBlock(t, '(?:kcet|cet)\\b', 180, 60, 'marks');
            if (kcetResult) e.kcetMarks = kcetResult.total;
            var rm = t.match(/\brank\b[^\d]{0,6}(\d+(?:\.\d+)?)\s*(k)?\b/);
            if (rm) { var v = parseFloat(rm[1]); if (rm[2]) v *= 1000;
                e.rank = Math.round(v); } else { var km = t.match(/\b(\d+(?:\.\d+)?)\s*k\b/); if (km) e.rank = Math
                    .round(parseFloat(km[1]) * 1000); }
            for (var i = 0; i < ALL_CATEGORY_CODES.length; i++) {
                var code = ALL_CATEGORY_CODES[i];
                var re = new RegExp('\\b' + code.toLowerCase() + '\\b');
                if (re.test(t)) { e.category = code; break; }
            }
            for (var short in BRANCH_SHORTHAND) {
                var re = new RegExp('\\b' + short.replace(/[/]/g, '\\/') + '\\b');
                if (re.test(t)) { e.branch = BRANCH_SHORTHAND[short]; break; }
            }
            for (var i = 0; i < KARNATAKA_CITIES.length; i++) {
                var city = KARNATAKA_CITIES[i];
                if (t.indexOf(city) !== -1) { e.location = city.charAt(0).toUpperCase() + city.slice(1); break; }
            }
            if (!e.location) {
                var lm = text.match(/\bin\s+([A-Z][a-zA-Z]+)\b/);
                if (lm && ['This', 'That', 'My', 'The'].indexOf(lm[1]) === -1) e.location = lm[1];
            }
            return e;
        }

        function extractCategoryOnly(text) {
            var t = ' ' + text.toLowerCase() + ' ';
            for (var i = 0; i < ALL_CATEGORY_CODES.length; i++) {
                var code = ALL_CATEGORY_CODES[i];
                if (new RegExp('\\b' + code.toLowerCase() + '\\b').test(t)) return code;
            }
            return null;
        }

        function showTempThinking() {
            document.getElementById('emptyHero').style.display = 'none';
            var body = document.getElementById('chatBody');
            body.style.display = 'block';
            var row = document.createElement('div');
            row.className = 'msg-row assistant';
            row.innerHTML = '<div class="msg-tag">PROTON</div><div class="msg-bubble">' + loadingLine('Thinking…') +
                '</div>';
            body.appendChild(row);
            document.getElementById('chatWrap').scrollTop = document.getElementById('chatWrap').scrollHeight;
            return row;
        }

        var pendingSmartQuery = null;

        function searchCollegesSmart(params) {
            var rank = params.rank,
                category = params.category,
                branch = params.branch,
                location = params.location;
            return loadDataset(HK_CATEGORIES.indexOf(category) !== -1 ? 'enghk' : 'eng').then(function(dataset) {
                var lowerBound = rank - 1500;
                var branchAliasPool = branch ? [branch] : null;
                var results = [];
                for (var i = 0; i < dataset.length; i++) {
                    var college = dataset[i];
                    if (location && (college.location || '').toLowerCase().indexOf(location.toLowerCase()) ===
                        -1) continue;
                    if (!college.branches) continue;
                    if (branchAliasPool) {
                        var key = matchBranchKey(branchAliasPool, college.branches);
                        if (!key) continue;
                        var cutoff = college.branches[key][category];
                        if (cutoff == null || cutoff < lowerBound) continue;
                        results.push({ id: college.id, name: college.name, location: college.location ||
                                'Karnataka', branch: key, cutoff: cutoff, dist: Math.abs(cutoff - rank) });
                    } else {
                        var bestKey = null,
                            bestCutoff = null,
                            bestDist = Infinity;
                        for (var bkey in college.branches) {
                            var cd = college.branches[bkey][category];
                            if (cd == null || cd < lowerBound) continue;
                            var dist = Math.abs(cd - rank);
                            if (dist < bestDist) { bestDist = dist;
                                bestKey = bkey;
                                bestCutoff = cd; }
                        }
                        if (bestKey) results.push({ id: college.id, name: college.name, location: college
                                .location || 'Karnataka', branch: bestKey, cutoff: bestCutoff,
                            dist: bestDist });
                    }
                }
                results.sort(function(a, b) { return a.dist - b.dist; });
                return results;
            });
        }

        function buildSmartCollegeAnswer(results, params) {
            var rank = params.rank,
                branch = params.branch,
                location = params.location,
                category = params.category;
            var branchLabel = branch ? escapeHtml(branch) : null;
            if (!results.length) {
                var html = 'Doesn\'t look likely' + (branchLabel ? ' for <b>' + branchLabel + '</b>' : '') + (
                    location ? ' in <b>' + escapeHtml(location) + '</b>' : '') + ' at rank ' + rank.toLocaleString(
                        'en-IN') + ' (' + category + ') — no eligible seats this round.';
                return html + getPromoHTML();
            }
            var shown = results.slice(0, 5);
            var names = results.slice(0, 3).map(function(r) { return getShortName(r.name); }).join(', ');
            var html = 'Yes — you could get' + (branchLabel ? ' <b>' + branchLabel + '</b>' : '') + (location ?
                ' in <b>' + escapeHtml(location) + '</b>' : '') + '. <b>' + results.length +
                '</b> matching option' + (results.length > 1 ? 's' : '') + ', closest: ' + escapeHtml(names) + (
                results.length > 3 ? ' +' + (results.length - 3) + ' more' : '') + '.';
            html += '<div style="margin-top:10px;">' + shown.map(function(r) { return collegeCardHtml(r, category); })
                .join('') + '</div>';
            if (results.length > 5) {
                html +=
                    '<div class="chip-row"><div class="mini-chip" data-action="see-more-smart">See all ' +
                    results.length + (location ? ' in ' + escapeHtml(location) : '') + '</div></div>';
            }
            html += getPromoHTML();
            return html;
        }

        function handleSmartMessage(rawText) {
            var thinkingRow = showTempThinking();
            setTimeout(function() {
                thinkingRow.remove();
                var entities = extractEntities(rawText);
                if (pendingSmartQuery) {
                    var merged = Object.assign({}, pendingSmartQuery.known, entities);
                    if (!merged.category) { var c = extractCategoryOnly(rawText); if (c) merged.category = c; }
                    entities = merged;
                }
                var kcetGuess = classifyKcetIntent(rawText);
                var looksKcetRelated = entities.kcetMarks != null || entities.boardPercentage != null ||
                    entities.rank != null || entities.category || entities.branch || /\b(kcet|cet|rank|board|puc?)\b/i
                    .test(rawText) || !!pendingSmartQuery;
                if (looksKcetRelated) {
                    routeKcetQuery(kcetGuess ? kcetGuess.intent : 'rank_prediction', entities);
                    return;
                }
                var chatGuess = classifyChat(rawText);
                if (chatGuess) { protonSays(String(chatGuess.output).replace(/</g, '&lt;').replace(/>/g, '&gt;')); return; }
                protonSays(
                    'I can help with <b>rank prediction</b>, <b>college prediction</b>, or matching your <b>priority list</b> — use the pills above, or just tell me your boards % and KCET score together.'
                    );
            }, 1600);
        }

        function routeKcetQuery(intent, entities) {
            if (entities.rank == null && entities.kcetMarks != null && entities.boardPercentage != null) {
                var kcetPct = (Math.min(180, entities.kcetMarks) / 180) * 100;
                var finalPct = computeFinalPercentage(entities.boardPercentage, kcetPct);
                entities.rank = kcetEngine.predictRank(finalPct);
                protonSays(
                    'Based on <b>' + entities.boardPercentage + '%</b> boards and <b>' + entities.kcetMarks +
                    '</b> KCET marks, your estimated rank is <b>' + entities.rank.toLocaleString('en-IN') +
                    '</b>.' + getPromoHTML()
                    );
            }
            var wantsCollege = intent !== 'rank_prediction' && intent !== 'rank_inquiry' || entities.category ||
                entities.branch || entities.location;
            if (entities.rank == null) {
                pendingSmartQuery = { known: entities, needs: ['rank'] };
                protonSays('Got it — what\'s your KCET score (or boards % + KCET score) so I can estimate your rank?');
                return;
            }
            if (!wantsCollege) {
                pendingSmartQuery = null;
                return;
            }
            if (!entities.category) {
                pendingSmartQuery = { known: entities, needs: ['category'] };
                protonSays(
                    'Rank ' + entities.rank.toLocaleString('en-IN') +
                    ' noted. Which category should I check against — GM, 1G, 2AG, SC, ST…?'
                    );
                return;
            }
            pendingSmartQuery = null;
            var thinkingRow2 = showTempThinking();
            searchCollegesSmart(entities).then(function(results) {
                thinkingRow2.remove();
                var row = protonSays(buildSmartCollegeAnswer(results, entities), results.length + ' matches');
                var seeMore = row.querySelector('[data-action="see-more-smart"]');
                if (seeMore) {
                    seeMore.addEventListener('click', function() {
                        openResultsPage('All matches' + (entities.location ? ' · ' + entities.location :
                            ''), results, entities.category);
                    });
                }
            }).catch(function(e) {
                thinkingRow2.remove();
                protonSays('<i class="fa-solid fa-triangle-exclamation"></i> Couldn\'t load the college dataset (' +
                    e.message + ').');
            });
        }

        /* ── composer ── */
        function initComposer() {
            var input = document.getElementById('composerInput');
            var sendBtn = document.getElementById('sendBtn');
            input.addEventListener('input', function() { input.style.height = 'auto';
                input.style.height = Math.min(100, input.scrollHeight) + 'px'; });

            function send() {
                var text = input.value.trim();
                if (!text) return;
                userSays(text);
                input.value = '';
                input.style.height = 'auto';
                handleSmartMessage(text);
            }
            sendBtn.addEventListener('click', send);
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                    send(); } });

            document.getElementById('pillRank').addEventListener('click', function() {
                userSays('Rank Prediction');
                openRankPredictionCard();
            });
            document.getElementById('pillCollege').addEventListener('click', function() {
                userSays('College Prediction');
                startCollegePredictionFlow();
            });
            document.getElementById('pillPriority').addEventListener('click', function() {
                userSays('Priority List');
                pillPriorityListStart();
            });
        }

        /* ── viewport fix ── */
        function setVH() {
            var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVH();
        window.addEventListener('resize', setVH);
        window.addEventListener('orientationchange', function() { setTimeout(setVH, 100); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setVH);
            window.visualViewport.addEventListener('scroll', setVH);
        }

        /* ── init ── */
        initOnboarding();
        initSidebar();
        initComposer();
        loadTrainingData();
        currentChatId = 'c_' + Date.now();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(function() { console.log('[x-bit] SW registered'); })
                .catch(function() { console.warn('[x-bit] SW registration failed'); });
        }
    </script>
</body>
</html>

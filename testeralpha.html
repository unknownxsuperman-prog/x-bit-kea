<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KCET Tester Alpha</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: monospace;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    #header {
        padding: 16px 18px;
        border-bottom: 1px solid #222;
    }

    #title {
        font-size: 15px;
    }

    #status {
        margin-top: 5px;
        color: #666;
        font-size: 11px;
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .message {
        margin-bottom: 20px;
    }

    .label {
        color: #555;
        font-size: 11px;
        margin-bottom: 7px;
    }

    .userText {
        color: #fff;
        white-space: pre-wrap;
    }

    pre {
        margin: 0;
        padding: 14px;
        background: #080808;
        border: 1px solid #222;
        color: #ccc;
        white-space: pre-wrap;
        overflow-x: auto;
        line-height: 1.5;
    }

    #inputBar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #222;
    }

    #input {
        flex: 1;
        min-width: 0;
        padding: 13px;
        background: #080808;
        color: #fff;
        border: 1px solid #333;
        outline: none;
        font-family: monospace;
        font-size: 14px;
    }

    #input:focus {
        border-color: #666;
    }

    #send {
        padding: 0 18px;
        background: #fff;
        color: #000;
        border: none;
        font-family: monospace;
        cursor: pointer;
    }

    #send:hover {
        opacity: .8;
    }
</style>
</head>

<body>

<div id="header">
    <div id="title">KCET TESTER ALPHA</div>
    <div id="status">Loading training data...</div>
</div>

<div id="chat"></div>

<div id="inputBar">

    <input
        id="input"
        type="text"
        placeholder="Type your KCET query..."
        autocomplete="off"
    >

    <button id="send">SEND</button>

</div>


<script>

/* ==================================================
   DATA
================================================== */

let TRAINING = [];
let SCHEMA = {};

let conversation = {};


/* ==================================================
   LOAD trainy.json + schema.json
================================================== */

async function loadModel() {

    try {

        const trainResponse =
            await fetch("./trainy.json");

        if (!trainResponse.ok) {
            throw new Error(
                "trainy.json HTTP " +
                trainResponse.status
            );
        }

        TRAINING =
            await trainResponse.json();


        const schemaResponse =
            await fetch("./schema.json");

        if (!schemaResponse.ok) {
            throw new Error(
                "schema.json HTTP " +
                schemaResponse.status
            );
        }

        SCHEMA =
            await schemaResponse.json();


        if (!Array.isArray(TRAINING)) {

            throw new Error(
                "trainy.json must contain an array"
            );
        }


        document.getElementById("status").textContent =
            "READY • " +
            TRAINING.length +
            " training examples";


        addAI({
            status: "ready",
            training_examples: TRAINING.length
        });

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ERROR";

        addAI({
            error: error.message,
            hint:
                "Make sure testeralpha.html, trainy.json and schema.json are in the same GitHub directory."
        });
    }
}


/* ==================================================
   NORMALIZE TEXT
================================================== */

function normalize(text) {

    return String(text)
        .toLowerCase()
        .replace(/[^\w\s./+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* ==================================================
   TOKENIZE
================================================== */

function tokenize(text) {

    return normalize(text)
        .split(" ")
        .filter(Boolean);
}


/* ==================================================
   SIMILARITY
================================================== */

function similarity(input, example) {

    const a = new Set(
        tokenize(input)
    );

    const b = new Set(
        tokenize(example)
    );

    if (!a.size || !b.size)
        return 0;


    let matches = 0;

    for (const word of a) {

        if (b.has(word)) {
            matches++;
        }
    }


    return matches /
        Math.sqrt(
            a.size * b.size
        );
}


/* ==================================================
   FIND CLOSEST TRAINING EXAMPLES
================================================== */

function findMatches(input) {

    const results = [];


    for (
        let i = 0;
        i < TRAINING.length;
        i++
    ) {

        const example =
            TRAINING[i];


        if (
            !example ||
            typeof example.input !== "string"
        ) {
            continue;
        }


        const score =
            similarity(
                input,
                example.input
            );


        results.push({

            score,
            index: i,
            example
        });
    }


    results.sort(
        (a, b) =>
            b.score - a.score
    );


    return results;
}


/* ==================================================
   VALUE EXTRACTION FROM USER INPUT
==================================================

   This is intentionally generic.

   It doesn't contain a hard-coded KCET
   intent system.

   It uses the keywords that exist in
   your training examples.
================================================== */

function extractValues(input, matchedExamples) {

    const result = {};


    /*
       First take keyword structures from
       the closest training examples.
    */

    for (
        const match of matchedExamples.slice(0, 5)
    ) {

        if (match.score <= 0)
            continue;


        const keywords =
            match.example.keywords;


        if (!keywords)
            continue;


        for (
            const key of Object.keys(keywords)
        ) {

            const value =
                keywords[key];


            if (
                value === null ||
                value === undefined
            ) {
                continue;
            }


            /*
               Don't overwrite something
               already found from a stronger
               match.
            */

            if (
                result[key] === undefined
            ) {

                result[key] = value;
            }
        }
    }


    /*
       Now try to extract numeric values
       using the feature names appearing
       in the training data.
    */

    extractNumericFeatures(
        input,
        result
    );


    /*
       Try to extract known categorical
       values from the training dataset.
    */

    extractCategoricalFeatures(
        input,
        result
    );


    return result;
}


/* ==================================================
   NUMERIC FEATURE EXTRACTION
================================================== */

function extractNumericFeatures(
    input,
    result
) {

    const text =
        normalize(input);


    const nums =
        text.match(
            /\b\d+(?:\.\d+)?\b/g
        );


    if (!nums)
        return;


    const numbers =
        nums.map(Number);


    /*
       Discover numeric feature names
       from the training data.
    */

    const numericFeatures =
        new Set();


    for (const example of TRAINING) {

        if (!example.keywords)
            continue;


        for (
            const key of Object.keys(
                example.keywords
            )
        ) {

            const value =
                example.keywords[key];


            if (
                typeof value === "number"
            ) {

                numericFeatures.add(key);
            }
        }
    }


    /*
       Direct feature-name references.

       Example:

       "mark_kcet 130"

       "per_boards 280"
    */

    for (
        const feature of numericFeatures
    ) {

        const regex =
            new RegExp(
                feature.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                ) +
                "\\s*[:=]?\\s*(\\d+(?:\\.\\d+)?)",
                "i"
            );


        const match =
            input.match(regex);


        if (match) {

            result[feature] =
                Number(match[1]);
        }
    }


    /*
       Handle natural-language board marks.

       This is intentionally generic and
       only activates when training data
       contains per_boards.
    */

    if (
        numericFeatures.has("per_boards") &&
        (
            text.includes("board") ||
            text.includes("boards")
        )
    ) {

        const boardNumbers =
            numbers.filter(
                n => n <= 300
            );


        if (
            boardNumbers.length
        ) {

            /*
               Prefer a number near "board".
            */

            const match =
                input.match(
                    /(\d+(?:\.\d+)?)\s*(?:\/\s*300)?\s*(?:in\s*)?boards?/i
                );


            if (match) {

                result.per_boards =
                    Number(match[1]);

            } else {

                /*
                   Only use this if there is
                   exactly one sensible board value.
                */

                if (
                    boardNumbers.length === 1
                ) {

                    result.per_boards =
                        boardNumbers[0];
                }
            }
        }
    }


    /*
       KCET marks.
    */

    if (
        numericFeatures.has("mark_kcet") &&
        (
            text.includes("kcet") ||
            text.includes("cet")
        )
    ) {

        const match =
            input.match(
                /(\d+(?:\.\d+)?)\s*(?:\/\s*180)?\s*(?:in\s*)?kcet/i
            );


        if (match) {

            result.mark_kcet =
                Number(match[1]);

        } else {

            const kcetNumbers =
                numbers.filter(
                    n => n <= 180
                );


            if (
                kcetNumbers.length === 1
            ) {

                result.mark_kcet =
                    kcetNumbers[0];
            }
        }
    }
}


/* ==================================================
   CATEGORICAL FEATURE EXTRACTION
================================================== */

function extractCategoricalFeatures(
    input,
    result
) {

    const text =
        normalize(input);


    /*
       Collect categorical values
       from training data.
    */

    const values = {};


    for (const example of TRAINING) {

        if (!example.keywords)
            continue;


        for (
            const key of Object.keys(
                example.keywords
            )
        ) {

            const value =
                example.keywords[key];


            if (
                typeof value === "string"
            ) {

                if (!values[key])
                    values[key] = new Set();


                values[key].add(
                    normalize(value)
                );
            }
        }
    }


    /*
       Look for known values in user text.
    */

    for (
        const feature of Object.keys(values)
    ) {

        /*
           Don't overwrite an already
           extracted feature.
        */

        if (
            result[feature] !== undefined
        ) {
            continue;
        }


        const candidates =
            [...values[feature]];


        /*
           Longest first so that something
           like "computer science engineering"
           is checked before "computer".
        */

        candidates.sort(
            (a, b) =>
                b.length - a.length
        );


        for (
            const candidate of candidates
        ) {

            if (!candidate)
                continue;


            const escaped =
                candidate.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            const regex =
                new RegExp(
                    "\\b" +
                    escaped +
                    "\\b",
                    "i"
                );


            if (
                regex.test(text)
            ) {

                /*
                   Find original casing/value
                   from training data.
                */

                for (
                    const example of TRAINING
                ) {

                    if (!example.keywords)
                        continue;


                    const value =
                        example.keywords[feature];


                    if (
                        typeof value === "string" &&
                        normalize(value) === candidate
                    ) {

                        result[feature] =
                            value;

                        break;
                    }
                }


                break;
            }
        }
    }
}


/* ==================================================
   MERGE CONVERSATION STATE
================================================== */

function mergeState(newKeywords) {

    for (
        const key of Object.keys(
            newKeywords
        )
    ) {

        const value =
            newKeywords[key];


        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            continue;
        }


        conversation[key] =
            value;
    }


    return {
        ...conversation
    };
}


/* ==================================================
   DETERMINE MISSING FEATURES
==================================================

   IMPORTANT:

   Missing information comes from the
   training examples.

   We don't blindly invent required
   features here.
================================================== */

function determineMissing(
    keywords,
    matches
) {

    const required = [];


    /*
       Use missing.required from the
       strongest relevant examples.
    */

    for (
        const match of matches.slice(0, 5)
    ) {

        if (
            match.score <= 0
        ) {
            continue;
        }


        const missing =
            match.example.missing;


        if (
            !missing ||
            !Array.isArray(
                missing.required
            )
        ) {
            continue;
        }


        for (
            const feature of
            missing.required
        ) {

            /*
               If the user has now supplied
               the feature, don't keep it missing.
            */

            if (
                keywords[feature] === undefined ||
                keywords[feature] === null ||
                keywords[feature] === ""
            ) {

                if (
                    !required.includes(
                        feature
                    )
                ) {

                    required.push(
                        feature
                    );
                }
            }
        }
    }


    return required;
}


/* ==================================================
   DETERMINE ACTIONS
==================================================

   Actions are inherited from training
   examples.

   Missing-input action is generated only
   when a matching training example
   actually says missing input is needed.
================================================== */

function determineActions(
    keywords,
    missing,
    matches
) {

    const actions = [];


    /*
       Take actions from strongest examples.
    */

    for (
        const match of matches.slice(0, 5)
    ) {

        if (
            match.score <= 0
        ) {
            continue;
        }


        const example =
            match.example;


        if (
            !Array.isArray(
                example.action
            )
        ) {
            continue;
        }


        for (
            const action of
            example.action
        ) {

            if (
                typeof action !== "string"
            ) {
                continue;
            }


            /*
               Don't duplicate.
            */

            if (
                !actions.includes(
                    action
                )
            ) {

                actions.push(
                    action
                );
            }
        }
    }


    /*
       Remove actions whose required
       feature has now been supplied,
       when they are explicitly
       ask_missing_input actions.
    */

    return actions.filter(
        action => {

            if (
                !action.startsWith(
                    "ask_missing_input"
                )
            ) {
                return true;
            }


            /*
               If no missing features remain,
               remove the ask action.
            */

            return missing.length > 0;
        }
    );
}


/* ==================================================
   PROCESS USER INPUT
================================================== */

function processInput(input) {

    const matches =
        findMatches(input);


    /*
       Extract information from the
       training examples + user sentence.
    */

    const extracted =
        extractValues(
            input,
            matches
        );


    /*
       Keep previous conversation state.
    */

    const keywords =
        mergeState(
            extracted
        );


    /*
       Determine what is still missing.
    */

    const missing =
        determineMissing(
            keywords,
            matches
        );


    /*
       Determine actions from training data.
    */

    const actions =
        determineActions(
            keywords,
            missing,
            matches
        );


    return {

        input,

        keywords,

        missing: {

            required:
                missing,

            trigger:
                missing.length > 0
                    ? "ask_missing_input"
                    : null
        },

        action:
            actions,

        matched_examples:
            matches
                .slice(0, 5)
                .map(
                    match => ({

                        similarity:
                            Number(
                                match.score
                                    .toFixed(4)
                            ),

                        input:
                            match.example.input
                    })
                )
    };
}


/* ==================================================
   UI
================================================== */

function addUser(text) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    div.innerHTML =
        `
        <div class="label">YOU</div>
        <div class="userText">
            ${escapeHTML(text)}
        </div>
        `;


    document
        .getElementById("chat")
        .appendChild(div);


    scrollChat();
}


function addAI(data) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    div.innerHTML =
        `
        <div class="label">MODEL OUTPUT</div>

        <pre>${escapeHTML(
            JSON.stringify(
                data,
                null,
                2
            )
        )}</pre>
        `;


    document
        .getElementById("chat")
        .appendChild(div);


    scrollChat();
}


function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function scrollChat() {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTop =
        chat.scrollHeight;
}


/* ==================================================
   SEND
================================================== */

function sendMessage() {

    const input =
        document.getElementById(
            "input"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    if (!TRAINING.length) {

        addAI({
            error:
                "Training data has not loaded yet."
        });

        return;
    }


    addUser(text);


    const output =
        processInput(text);


    addAI(output);


    input.value = "";

    input.focus();
}


/* ==================================================
   EVENTS
================================================== */

document
    .getElementById("send")
    .addEventListener(
        "click",
        sendMessage
    );


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                sendMessage();
            }
        }
    );


/* ==================================================
   START
================================================== */

loadModel();

</script>

</body>
</html>

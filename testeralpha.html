<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KCET AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#header {
    padding: 16px;
    border-bottom: 1px solid #222;
    font-size: 15px;
}

#status {
    color: #666;
    font-size: 11px;
    margin-top: 5px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 20px;
    max-width: 900px;
}

.user {
    color: #fff;
}

.ai {
    color: #aaa;
}

.label {
    color: #555;
    margin-bottom: 5px;
}

pre {
    margin: 0;
    padding: 12px;
    background: #080808;
    border: 1px solid #222;
    overflow-x: auto;
    white-space: pre-wrap;
}

#inputBar {
    display: flex;
    border-top: 1px solid #222;
    padding: 12px;
    gap: 8px;
}

#input {
    flex: 1;
    background: #080808;
    color: #fff;
    border: 1px solid #333;
    padding: 13px;
    font-family: monospace;
    outline: none;
}

#send {
    background: #fff;
    color: #000;
    border: 0;
    padding: 0 20px;
    font-family: monospace;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="header">
    KCET AI
    <div id="status">Loading...</div>
</div>

<div id="chat"></div>

<div id="inputBar">

    <input
        id="input"
        placeholder="Ask your KCET question..."
        autocomplete="off"
    >

    <button id="send">SEND</button>

</div>


<script>

let TRAINING = [];
let SCHEMA = {};


// ==================================================
// CONVERSATION STATE
// ==================================================

let STATE = {
    mark_boards: null,

    mark_boards_math: null,
    mark_boards_phy: null,
    mark_boards_che: null,

    mark_kcet: null,

    mark_kcet_math: null,
    mark_kcet_phy: null,
    mark_kcet_che: null,

    predicted_rank: null,

    college: null,
    branch: null,
    category: null,

    location: null,
    location_filter: null,

    round: null,

    intent: null
};


// ==================================================
// LOAD JSON FILES
// ==================================================

async function loadFiles() {

    try {

        const trainResponse =
            await fetch("./trainy.json");

        TRAINING =
            await trainResponse.json();


        const schemaResponse =
            await fetch("./schema.json");

        SCHEMA =
            await schemaResponse.json();


        document.getElementById("status").textContent =
            "Model ready • " +
            TRAINING.length +
            " training examples";


        addAI(
            "KCET AI ready.\n\n" +
            "Training examples: " +
            TRAINING.length
        );

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Failed to load model";

        addAI(
            "ERROR\n\n" +
            "Make sure these files are in the same GitHub folder:\n\n" +
            "index.html\n" +
            "trainy.json\n" +
            "schema.json"
        );
    }
}


// ==================================================
// NORMALIZE
// ==================================================

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w\s./+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


// ==================================================
// TOKENIZE
// ==================================================

function tokenize(text) {

    return normalize(text)
        .split(" ")
        .filter(Boolean);
}


// ==================================================
// TEXT SIMILARITY
// ==================================================

function similarity(a, b) {

    const A = new Set(tokenize(a));
    const B = new Set(tokenize(b));

    if (!A.size || !B.size)
        return 0;

    let common = 0;

    for (const word of A) {

        if (B.has(word))
            common++;
    }

    return common /
        Math.sqrt(A.size * B.size);
}


// ==================================================
// FIND TRAINING EXAMPLES
// ==================================================

function findExamples(input) {

    const results = [];

    for (const example of TRAINING) {

        if (!example.input)
            continue;

        const score =
            similarity(
                input,
                example.input
            );

        results.push({
            score,
            example
        });
    }

    results.sort(
        (a, b) => b.score - a.score
    );

    return results.slice(0, 5);
}


// ==================================================
// NUMBER EXTRACTION
// ==================================================

function numbers(text) {

    const matches =
        text.match(/\d+(?:\.\d+)?/g);

    if (!matches)
        return [];

    return matches.map(Number);
}


// ==================================================
// MARK EXTRACTION
// ==================================================

function extractMarks(text) {

    const t = normalize(text);

    const nums = numbers(text);

    if (!nums.length)
        return;


    // ----------------------------------------------
    // BOARDS
    // ----------------------------------------------

    if (
        t.includes("board") ||
        t.includes("boards") ||
        t.includes("puc")
    ) {

        const board =
            nums.find(n => n <= 300);

        if (
            board !== undefined &&
            !t.includes("kcet")
        ) {

            STATE.mark_boards = board;
        }
    }


    // ----------------------------------------------
    // KCET TOTAL
    // ----------------------------------------------

    if (
        t.includes("kcet") ||
        t.includes("cet")
    ) {

        const kcet =
            nums.find(n => n <= 180);

        if (
            kcet !== undefined
        ) {

            STATE.mark_kcet = kcet;
        }
    }
}


// ==================================================
// BRANCH EXTRACTION
// ==================================================

function extractBranch(text) {

    const t = normalize(text);

    const branches = {

        "computer science engineering": "CSE",
        "computer science": "CSE",
        "cse": "CSE",

        "information science engineering": "ISE",
        "information science": "ISE",
        "ise": "ISE",

        "electronics and communication": "ECE",
        "electronics communication": "ECE",
        "ece": "ECE",

        "electrical and electronics": "EEE",
        "electrical": "EEE",
        "eee": "EEE",

        "mechanical engineering": "Mechanical",
        "mechanical": "Mechanical",

        "civil engineering": "Civil",
        "civil": "Civil",

        "artificial intelligence and machine learning": "AIML",
        "artificial intelligence": "AIML",
        "ai ml": "AIML",
        "aiml": "AIML",

        "data science": "Data Science"
    };


    for (const key in branches) {

        if (t.includes(key)) {

            STATE.branch =
                branches[key];

            return;
        }
    }
}


// ==================================================
// CATEGORY EXTRACTION
// ==================================================

function extractCategory(text) {

    const t =
        normalize(text)
        .toUpperCase();

    const categories = [

        "2AR",
        "2BR",
        "3AR",
        "3BR",

        "GM",
        "1G",
        "1R",

        "2A",
        "2B",

        "3A",
        "3B",

        "SC",
        "SCR",

        "ST",
        "STR"
    ];


    for (const category of categories) {

        if (
            new RegExp(
                "\\b" +
                category +
                "\\b"
            ).test(t)
        ) {

            STATE.category =
                category;

            return;
        }
    }
}


// ==================================================
// LOCATION EXTRACTION
// ==================================================

function extractLocation(text) {

    const t = normalize(text);

    const locations = {

        "bangalore": "Bangalore",
        "bengaluru": "Bangalore",

        "mysore": "Mysore",
        "mysuru": "Mysore",

        "mangalore": "Mangalore",
        "mangaluru": "Mangalore",

        "hubli": "Hubli",
        "hubballi": "Hubli",

        "dharwad": "Dharwad",

        "tumkur": "Tumkur",
        "tumakuru": "Tumkur",

        "belgaum": "Belagavi",
        "belagavi": "Belagavi",

        "davangere": "Davangere",

        "shivamogga": "Shivamogga",
        "shimoga": "Shivamogga"
    };


    for (const key in locations) {

        if (t.includes(key)) {

            STATE.location =
                locations[key];

            if (
                t.includes("near") ||
                t.includes("around")
            ) {

                STATE.location_filter =
                    "near";
            }

            return;
        }
    }
}


// ==================================================
// ROUND EXTRACTION
// ==================================================

function extractRound(text) {

    const t = normalize(text);


    if (
        t.includes("mock cutoff") ||
        t.includes("mock cutoff")
    ) {

        STATE.round =
            "mock_cutoff";

    }

    else if (
        t.includes("mock")
    ) {

        STATE.round =
            "mock";

    }

    else if (
        t.includes("provisional")
    ) {

        STATE.round =
            "provisional";

    }

    else if (
        t.includes("first round")
    ) {

        STATE.round =
            "first_round";

    }

    else if (
        t.includes("second round")
    ) {

        STATE.round =
            "second_round";

    }

    else if (
        t.includes("third round")
    ) {

        STATE.round =
            "third_round";
    }
}


// ==================================================
// INTENT EXTRACTION
// ==================================================

function extractIntent(text) {

    const t = normalize(text);


    if (
        t.includes("what college") ||
        t.includes("which college") ||
        t.includes("what colleges") ||
        t.includes("college can i get") ||
        t.includes("colleges can i get")
    ) {

        STATE.intent =
            "predict_college";

    }

    else if (
        t.includes("predict rank") ||
        t.includes("my rank") ||
        t.includes("what rank")
    ) {

        STATE.intent =
            "predict_rank";

    }

    else if (
        t.includes("cutoff")
    ) {

        STATE.intent =
            "check_cutoff";
    }
}


// ==================================================
// APPLY TRAINING KEYWORDS
// ==================================================

function applyTrainingKeywords(matches) {

    if (!matches.length)
        return;


    /*
       Only use reasonably similar examples.
       This prevents a random example from
       overwriting the actual user input.
    */

    const best =
        matches[0];


    if (best.score < 0.20)
        return;


    const keywords =
        best.example.keywords || {};


    for (const key of Object.keys(keywords)) {

        const value =
            keywords[key];


        if (
            value === null ||
            value === undefined
        )
            continue;


        /*
           Don't blindly overwrite values that
           the user has explicitly provided.
        */

        if (
            STATE[key] === null ||
            STATE[key] === undefined
        ) {

            STATE[key] = value;
        }
    }
}


// ==================================================
// MISSING FEATURES
// ==================================================

function getMissing() {

    const missing = [];


    // ----------------------------------------------
    // RANK REQUIREMENTS
    // ----------------------------------------------

    const hasBoards =
        STATE.mark_boards !== null ||
        (
            STATE.mark_boards_math !== null &&
            STATE.mark_boards_phy !== null &&
            STATE.mark_boards_che !== null
        );


    const hasKCET =
        STATE.mark_kcet !== null ||
        (
            STATE.mark_kcet_math !== null &&
            STATE.mark_kcet_phy !== null &&
            STATE.mark_kcet_che !== null
        );


    if (!hasBoards)
        missing.push("mark_boards");


    if (!hasKCET)
        missing.push("mark_kcet");


    // ----------------------------------------------
    // COLLEGE PREDICTION
    // ----------------------------------------------

    if (
        STATE.intent ===
        "predict_college"
    ) {

        if (!STATE.branch)
            missing.push("branch");

        if (!STATE.category)
            missing.push("category");
    }


    // ----------------------------------------------
    // SPECIFIC COLLEGE
    // ----------------------------------------------

    if (
        STATE.intent ===
        "check_specific_college"
    ) {

        if (!STATE.college)
            missing.push("college");

        if (!STATE.branch)
            missing.push("branch");

        if (!STATE.category)
            missing.push("category");
    }


    return [
        ...new Set(missing)
    ];
}


// ==================================================
// BUILD ACTIONS
// ==================================================

function buildActions(missing) {

    const actions = [];


    const hasBoards =
        STATE.mark_boards !== null;


    const hasKCET =
        STATE.mark_kcet !== null;


    // ----------------------------------------------
    // RANK
    // ----------------------------------------------

    if (
        hasBoards &&
        hasKCET
    ) {

        actions.push(
            "predict_rank(mark_boards, mark_kcet)"
        );
    }


    // ----------------------------------------------
    // COLLEGE
    // ----------------------------------------------

    if (
        STATE.intent ===
        "predict_college" &&
        hasBoards &&
        hasKCET &&
        STATE.branch &&
        STATE.category
    ) {

        if (STATE.round) {

            actions.push(
                `predict_college(predict_rank, ${STATE.round}, category, branch)`
            );

        } else {

            actions.push(
                "predict_college(predict_rank, category, branch)"
            );
        }
    }


    // ----------------------------------------------
    // LOCATION
    // ----------------------------------------------

    if (STATE.location) {

        if (
            STATE.location_filter ===
            "near"
        ) {

            actions.push(
                `verify_location(${STATE.location}, near=true)`
            );

        } else {

            actions.push(
                `verify_location(${STATE.location})`
            );
        }
    }


    // ----------------------------------------------
    // MISSING
    // ----------------------------------------------

    if (missing.length) {

        actions.push(
            `ask_missing_input(${missing.join(", ")})`
        );
    }


    return actions;
}


// ==================================================
// PROCESS INPUT
// ==================================================

function process(input) {

    const matches =
        findExamples(input);


    // Training-derived information
    applyTrainingKeywords(matches);


    // Direct user extraction
    extractMarks(input);
    extractBranch(input);
    extractCategory(input);
    extractLocation(input);
    extractRound(input);
    extractIntent(input);


    const missing =
        getMissing();


    const actions =
        buildActions(missing);


    return {

        input,

        keywords: {
            ...STATE
        },

        missing: {

            required:
                missing,

            trigger:
                missing.length
                    ? "ask_missing_input"
                    : null
        },

        action: actions,

        matched_examples:
            matches.slice(0, 3).map(x => ({
                input:
                    x.example.input,

                similarity:
                    Number(
                        x.score.toFixed(3)
                    )
            }))
    };
}


// ==================================================
// CHAT UI
// ==================================================

function addUser(text) {

    const div =
        document.createElement("div");

    div.className =
        "message user";

    div.innerHTML =
        `<div class="label">YOU</div>${escapeHTML(text)}`;

    document
        .getElementById("chat")
        .appendChild(div);

    scrollBottom();
}


function addAI(result) {

    const div =
        document.createElement("div");

    div.className =
        "message ai";

    div.innerHTML =
        `<div class="label">KCET AI</div>
         <pre>${escapeHTML(
             JSON.stringify(
                 result,
                 null,
                 2
             )
         )}</pre>`;

    document
        .getElementById("chat")
        .appendChild(div);

    scrollBottom();
}


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}


function scrollBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


// ==================================================
// SEND
// ==================================================

function send() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();


    if (!text)
        return;


    addUser(text);


    const result =
        process(text);


    addAI(result);


    input.value = "";

    input.focus();
}


// ==================================================
// ENTER
// ==================================================

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                send();
            }
        }
    );


document
    .getElementById("send")
    .addEventListener(
        "click",
        send
    );


// ==================================================
// START
// ==================================================

loadFiles();

</script>

</body>
</html>

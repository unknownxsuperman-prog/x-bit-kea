<script>
/* ══════════════════════════════════════════════════════════
   CONSTANTS
   ══════════════════════════════════════════════════════════ */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const GENERAL_CATEGORIES = ['1G','1K','1R','2AG','2AK','2AR','2BG','2BK','2BR','3AG','3AK','3AR','3BG','3BK','3BR','GM','GMK','GMP','GMR','NRI','OPN','OTH','S1G','S1K','S1R','S2G','S2K','S2R','S3G','S3K','S3R','S4G','S4K','S4R','STG','STK','STR'];
const HK_CATEGORIES = ['1H','1KH','1RH','2AH','2AKH','2ARH','2BH','2BKH','2BRH','3AH','3AKH','3ARH','3BH','3BKH','3BRH','GMH','GMKH','GMPH','GMRH','S1H','S1KH','S1RH','S2H','S2KH','S2RH','S3H','S3KH','S3RH','S4H','S4KH','S4RH','STH','STKH','STRH'];
const ALL_CATEGORY_CODES = [...GENERAL_CATEGORIES, ...HK_CATEGORIES].sort((a,b)=>b.length-a.length);

const LS = {
  get(k, def){ try{ const v = localStorage.getItem('xbit_'+k); return v!==null ? JSON.parse(v) : def; }catch{ return def; } },
  set(k, v){ try{ localStorage.setItem('xbit_'+k, JSON.stringify(v)); }catch{} }
};

function escapeHtml(str){ if(str==null) return ''; return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pad(n,w){ return String(n).padEnd(w); }
function padS(n,w){ return String(n).padStart(w); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function getShortName(name){ if(!name) return ''; const i=name.indexOf(','); return (i>0?name.substring(0,i):name).trim(); }

/* ══════════════════════════════════════════════════════════
   RANK PREDICTOR ENGINE
   ══════════════════════════════════════════════════════════ */
class KCETRankPredictor{
  constructor(){
    this.totalCandidates = 315000;
    this.anchors = [
      {p:100.0,r:1},{p:98.50,r:10},{p:96.00,r:100},{p:92.50,r:1000},{p:88.50,r:3000},
      {p:85.00,r:5500},{p:81.50,r:9000},{p:77.00,r:15000},{p:72.00,r:25000},
      {p:65.00,r:50000},{p:58.00,r:75000},{p:0.00,r:315000}
    ];
    this.formulas = [];
    this._compile();
  }
  _compile(){
    for(let i=0;i<this.anchors.length-1;i++){
      const up=this.anchors[i], lo=this.anchors[i+1];
      const M=(Math.log(lo.r)-Math.log(up.r))/(lo.p-up.p);
      const C=Math.log(up.r)-M*up.p;
      this.formulas.push({maxP:up.p, minP:lo.p, M, C});
    }
  }
  predictRank(pct){
    if(pct>=100) return 1;
    if(pct<=0) return this.totalCandidates;
    for(const f of this.formulas){
      if(pct<=f.maxP && pct>f.minP){
        let rank = Math.exp(f.M*pct+f.C);
        const upR=this.anchors.find(a=>a.p===f.maxP).r, loR=this.anchors.find(a=>a.p===f.minP).r;
        return Math.round(Math.max(Math.min(upR,loR), Math.min(Math.max(upR,loR), rank)));
      }
    }
    return this.totalCandidates;
  }
}
const kcetEngine = new KCETRankPredictor();
function computeFinalPercentage(boardsPct, kcetPct){ return (boardsPct/2) + (kcetPct/2); }

function parseScoreInput(raw, maxTotal, subjectMax, ambiguousDefault){
  const t = (raw||'').trim();
  if(!t) return null;
  if(t.includes(',')){
    const parts = t.split(',').map(s=>parseFloat(s.trim()));
    if(parts.length>=3 && parts.slice(0,3).every(p=>!isNaN(p) && p<=subjectMax && p>=0)){
      const sum = parts[0]+parts[1]+parts[2];
      return (sum/maxTotal)*100;
    }
    return null;
  }
  const v = parseFloat(t.replace('%','').trim());
  if(isNaN(v)) return null;
  if(t.includes('%')) return Math.min(100, v);
  if(v>100) return (Math.min(maxTotal, v)/maxTotal)*100;
  return ambiguousDefault==='marks' ? (Math.min(maxTotal, v)/maxTotal)*100 : Math.min(100, v);
}

/* ══════════════════════════════════════════════════════════
   DATA LOADING — real fetch/import of the app's real modules
   ══════════════════════════════════════════════════════════ */
const datasetCache = {};
let branchAliasesCache = null;

function loadDataset(which){
  return new Promise((resolve, reject)=>{
    if(datasetCache[which]) return resolve(datasetCache[which]);
    const src = which === 'enghk' ? './firstroundenghk.js' : './firstroundeng.js';
    const script = document.createElement('script');
    script.src = src;
    script.onload = ()=>{
      const data = window.XOS_CUTOFF || [];
      datasetCache[which] = data;
      window.XOS_CUTOFF = undefined;
      resolve(data);
    };
    script.onerror = ()=> reject(new Error(`could not load ${src}`));
    document.body.appendChild(script);
  });
}
function loadBranchAliases(){
  if(branchAliasesCache) return Promise.resolve(branchAliasesCache);
  return fetch('./branch-aliases.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(data=>{ branchAliasesCache = data; return data; });
}

function normBranch(s){ return s.toUpperCase().replace(/[^A-Z0-9\s&]/g,' ').replace(/\s+/g,' ').trim(); }
function matchBranchKey(aliasList, branchKeysOfCollege){
  const keys = Object.keys(branchKeysOfCollege);
  const candidates = aliasList.map(normBranch);
  for(const k of keys){ const nk=normBranch(k); if(candidates.includes(nk)) return k; }
  for(const k of keys){ const nk=normBranch(k); if(candidates.some(c=>nk.includes(c)||c.includes(nk))) return k; }
  let best=null, bestScore=0;
  for(const k of keys){
    const bw = new Set(normBranch(k).split(' ').filter(w=>w.length>1));
    for(const c of candidates){
      const cw = new Set(c.split(' ').filter(w=>w.length>1));
      const inter=[...cw].filter(w=>bw.has(w)).length;
      const union=new Set([...cw,...bw]).size;
      const sc = union? inter/union : 0;
      if(sc>bestScore){ bestScore=sc; best=k; }
    }
  }
  return bestScore>=0.4 ? best : null;
}

/* ══════════════════════════════════════════════════════════
   PDF PARSING — KEA priority-list Option Entry export
   ══════════════════════════════════════════════════════════ */
async function parsePriorityPdf(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const tokens = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    tc.items.forEach(item=>{ const s=item.str.trim(); if(s.length) tokens.push(s); });
  }
  const results = [];
  const priorityRe = /^\d+$/, codeRe = /^[A-Z]\d{3}[A-Z]{2}$/i;
  const anchors = [];
  for(let i=0;i<tokens.length-1;i++){ if(priorityRe.test(tokens[i]) && codeRe.test(tokens[i+1])) anchors.push(i); }
  for(let a=0;a<anchors.length;a++){
    const idx=anchors[a], priority=parseInt(tokens[idx],10), code=tokens[idx+1].toUpperCase(), collegeId=code.substring(0,4);
    const end = a+1<anchors.length ? anchors[a+1] : tokens.length;
    const rawText = tokens.slice(idx+2,end).join(' ');
    const normalized = rawText.replace(/(\d)\s*,\s*(\d)/g,'$1,$2');
    let branch;
    const feeMatch = normalized.match(/\d{1,3}(?:,\d{2,3})+/);
    if(feeMatch){
      const feeInRaw = rawText.match(/\d{1,3}\s*(?:,\s*\d{2,3}\s*)+/);
      branch = feeInRaw ? rawText.substring(0,feeInRaw.index).trim() : rawText.substring(0,rawText.indexOf(feeMatch[0])).trim();
    } else {
      const numMatch = rawText.match(/\d{5,}/);
      branch = numMatch ? rawText.substring(0,numMatch.index).trim() : rawText.trim();
    }
    branch = branch.replace(/[\s\-–—:]+$/,'').replace(/\s+/g,' ').trim();
    if(branch.length>0) results.push({priority, collegeId, branch});
  }
  return results;
}
function matchPriorityOptions(dataset, options, category, userRank){
  const map = {};
  dataset.forEach(c=>{ map[c.id]=c; });
  return options.map(opt=>{
    const college = map[opt.collegeId];
    if(!college) return {...opt, collegeName:null, status:'no-data', cutoff:null};
    const mb = matchBranchKey([opt.branch], college.branches);
    if(!mb) return {...opt, collegeName:college.name, status:'no-data', cutoff:null};
    const cutoff = college.branches[mb][category];
    if(cutoff==null) return {...opt, collegeName:college.name, matchedBranch:mb, status:'no-seat', cutoff:null};
    const eligible = cutoff >= userRank;
    return {...opt, collegeName:college.name, matchedBranch:mb, cutoff, status: eligible?'eligible':'not-eligible'};
  });
}

/* ══════════════════════════════════════════════════════════
   SMART CHAT ENGINE — bag-of-words / Jaccard classifier over
   trainingset.json (KCET intents) and trainingset1.json (chat)
   ══════════════════════════════════════════════════════════ */
let kcetTrainingSet = [];
let chatTrainingSet = [];

async function loadTrainingData(){
  try{
    const r = await fetch('./trainingset.json');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    kcetTrainingSet = await r.json();
  }catch(e){ kcetTrainingSet = []; throw e; }
  try{
    const r2 = await fetch('./trainingset1.json');
    if(!r2.ok) throw new Error('HTTP ' + r2.status);
    chatTrainingSet = await r2.json();
  }catch(e){ chatTrainingSet = []; }
  kcetTrainingSet.forEach(ex => ex._tokens = new Set(patternTokens(ex.input)));
  chatTrainingSet.forEach(ex => ex._tokens = new Set(tokenize(ex.input)));
}
function normalizeText(s){ return s.toLowerCase().replace(/[^\w\s%.]/g,' ').replace(/\s+/g,' ').trim(); }
function tokenize(s){ return normalizeText(s).split(' ').filter(Boolean); }
function patternTokens(s){ return normalizeText(s).replace(/\d+\.?\d*/g,'#num#').split(' ').filter(Boolean); }
function jaccard(a, b){ let inter=0; for(const t of a) if(b.has(t)) inter++; const union=a.size+b.size-inter; return union? inter/union : 0; }
function classifyChat(text){
  if(!chatTrainingSet.length) return null;
  const q = new Set(tokenize(text));
  if(!q.size) return null;
  let best=null, bestScore=0;
  for(const ex of chatTrainingSet){ const sc=jaccard(q, ex._tokens); if(sc>bestScore){ bestScore=sc; best=ex; } }
  return best && bestScore>0.3 ? best : null;
}

const KARNATAKA_CITIES = ['bangalore','bengaluru','mysore','mysuru','mangalore','mangaluru','hubli','hubballi','belgaum','belagavi','dharwad','shimoga','shivamogga','hassan','tumkur','tumakuru','davangere','bellary','ballari','gulbarga','kalaburagi','bidar','raichur','udupi','chikmagalur','kolar','mandya','chitradurga','bagalkot','hospet','bijapur','vijayapura'];
const BRANCH_SHORTHAND = {
  cse:'Computer Science and Engineering', cs:'Computer Science and Engineering',
  ise:'Information Science and Engineering', it:'Information Technology',
  ai:'Artificial Intelligence', 'ai/ml':'Artificial Intelligence and Machine Learning', aiml:'Artificial Intelligence and Machine Learning', ml:'Machine Learning',
  ece:'Electronics and Communication Engineering', eee:'Electrical & Electronics Engineering',
  mech:'Mechanical Engineering', mechanical:'Mechanical Engineering',
  civil:'Civil Engineering', chem:'Chemical Engineering', chemical:'Chemical Engineering',
  aero:'Aerospace Engineering', aeronautical:'Aeronautical Engineering'
};
const SUBJ_RE = { physics:/phy(?:sics)?/, chemistry:/chem(?:istry)?/, maths:/math(?:s|ematics)?/ };
function extractSubjectMarks(segment){
  const marks = {};
  for(const [subj, re] of Object.entries(SUBJ_RE)){
    const after = new RegExp(re.source + '\\D{0,4}(\\d{1,3}(?:\\.\\d+)?)', 'i');
    const before = new RegExp('(\\d{1,3}(?:\\.\\d+)?)\\D{0,4}' + re.source, 'i');
    const mm = segment.match(after) || segment.match(before);
    if(mm) marks[subj] = parseFloat(mm[1]);
  }
  if(marks.physics!=null && marks.chemistry!=null && marks.maths!=null) return marks;
  return null;
}
function findScoreBlock(text, keywordSrc, maxTotal, subjectMax, ambiguousDefault){
  const subj = extractSubjectMarks(text);
  if(subj && subj.physics<=subjectMax && subj.chemistry<=subjectMax && subj.maths<=subjectMax){
    const total = subj.physics + subj.chemistry + subj.maths;
    return { total, pct: (total/maxTotal)*100 };
  }
  let pctMatch = text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)\\s*%', 'i')) ||
                 text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*%\\s*(?:in\\s*)?' + keywordSrc, 'i'));
  if(pctMatch){ const v = Math.min(100, parseFloat(pctMatch[1])); return { pct: v, total: (v/100)*maxTotal }; }
  let explicitMarks = text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*marks?\\s*(?:in\\s*)?' + keywordSrc, 'i')) ||
                       text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)\\s*marks', 'i'));
  if(explicitMarks){ const v = parseFloat(explicitMarks[1]); if(v<=maxTotal) return { total: v, pct: (v/maxTotal)*100 }; }
  let totalMatch = text.match(new RegExp(keywordSrc + '\\D{0,3}(\\d+(?:\\.\\d+)?)', 'i')) ||
                    text.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*(?:marks?)?\\s*(?:in\\s*)?' + keywordSrc, 'i'));
  if(totalMatch){
    const v = parseFloat(totalMatch[1]);
    if(v <= maxTotal){
      if(v > 100) return { total: v, pct: (v/maxTotal)*100 };
      if(ambiguousDefault === 'marks') return { total: v, pct: (v/maxTotal)*100 };
      return { pct: v, total: (v/100)*maxTotal };
    }
  }
  return null;
}
function extractEntities(text){
  const t = ' ' + text.toLowerCase() + ' ';
  const e = {};
  const boardsResult = findScoreBlock(t, '(?:boards?|2nd\\s*pu|puc?)\\b', 300, 100, 'percentage');
  if(boardsResult) e.boardPercentage = boardsResult.pct;
  const kcetResult = findScoreBlock(t, '(?:kcet|cet)\\b', 180, 60, 'marks');
  if(kcetResult) e.kcetMarks = kcetResult.total;
  let rm = t.match(/\brank\b[^\d]{0,6}(\d+(?:\.\d+)?)\s*(k)?\b/);
  if(rm){ let v = parseFloat(rm[1]); if(rm[2]) v*=1000; e.rank = Math.round(v); }
  else { const km = t.match(/\b(\d+(?:\.\d+)?)\s*k\b/); if(km) e.rank = Math.round(parseFloat(km[1])*1000); }
  for(const code of ALL_CATEGORY_CODES){ if(new RegExp('\\b'+code.toLowerCase()+'\\b').test(t)){ e.category=code; break; } }
  for(const short in BRANCH_SHORTHAND){ if(new RegExp('\\b'+short.replace(/[/]/g,'\\/')+'\\b').test(t)){ e.branch=BRANCH_SHORTHAND[short]; break; } }
  for(const city of KARNATAKA_CITIES){ if(t.includes(city)){ e.location=city.charAt(0).toUpperCase()+city.slice(1); break; } }
  if(!e.location){ const lm = text.match(/\bin\s+([A-Z][a-zA-Z]+)\b/); if(lm && !['This','That','My','The'].includes(lm[1])) e.location = lm[1]; }
  return e;
}
function extractCategoryOnly(text){
  const t = ' ' + text.toLowerCase() + ' ';
  for(const code of ALL_CATEGORY_CODES){ if(new RegExp('\\b'+code.toLowerCase()+'\\b').test(t)) return code; }
  return null;
}

/* ══════════════════════════════════════════════════════════
   TERMINAL ENGINE — every question and answer lives right here.
   No separate chat UI: printing + a real Enter-driven prompt.
   ══════════════════════════════════════════════════════════ */
const termBody = document.getElementById('termBody');
const hiddenInput = document.getElementById('termHiddenInput');
class FlowCancel extends Error{}

let typed = '';
let awaitingResolve = null;
let userName = LS.get('username', '');
let lastResults = null;
let currentTranscript = [];
let sessionId = 's_' + Date.now();

function scrollBottom(){ termBody.scrollTop = termBody.scrollHeight; }
function record(tag, text){ currentTranscript.push({tag, text, ts: Date.now()}); }

function printRaw(html, cls){
  const div = document.createElement('div');
  div.className = 'term-line' + (cls?(' '+cls):'');
  div.innerHTML = html;
  termBody.appendChild(div);
  scrollBottom();
  return div;
}
function say(text){ printRaw(`<span class="term-tag-proton">proton ›</span> ${text}`); record('proton', text.replace(/<[^>]+>/g,'')); }
function sayDim(text){ printRaw(text, 'dim'); record('sys', text.replace(/<[^>]+>/g,'')); }
function sayOk(text){ printRaw(text, 'ok'); record('sys', text.replace(/<[^>]+>/g,'')); }
function sayWarn(text){ printRaw(text, 'warn'); record('sys', text.replace(/<[^>]+>/g,'')); }
function sayErr(text){ printRaw(text, 'err'); record('sys', text.replace(/<[^>]+>/g,'')); }
function sayHl(text){ printRaw(text, 'hl'); record('sys', text.replace(/<[^>]+>/g,'')); }
function sayTable(rawText){ printRaw(`<pre class="term-table">${escapeHtml(rawText)}</pre>`, 'ok'); record('sys', rawText); }
function echoYou(text){ printRaw(`<span class="term-tag-you">you ›</span> ${escapeHtml(text)}`); record('you', text); }

function printPrompt(marker){
  const row = document.createElement('div');
  row.className = 'term-line term-prompt-row';
  row.id = 'termCurrentPrompt';
  const tag = marker || `<span class="term-prompt-tag">guest@x-bit</span><span class="term-prompt-sep">:</span><span class="term-prompt-path">~/proton</span><span class="term-prompt-sep">$&nbsp;</span>`;
  row.innerHTML = `${tag}<span class="term-typed" id="termTypedSpan"></span><span class="term-cursor" id="termCursorEl"></span>`;
  termBody.appendChild(row);
  scrollBottom();
}
function refreshTyped(){ const s=document.getElementById('termTypedSpan'); if(s) s.textContent = typed; scrollBottom(); }
function lockPromptAsHistory(){
  const cur = document.getElementById('termCurrentPrompt');
  if(cur) cur.removeAttribute('id');
  const c = document.getElementById('termCursorEl');
  if(c) c.remove();
}
function setBusy(b){ hiddenInput.disabled = b; }

function focusHidden(){ if(!hiddenInput.disabled) hiddenInput.focus({preventScroll:true}); }
document.getElementById('shell').addEventListener('click', focusHidden);
window.addEventListener('pageshow', focusHidden);

hiddenInput.addEventListener('input', ()=>{ typed = hiddenInput.value; refreshTyped(); });
hiddenInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); submitLine(); }
});

function submitLine(){
  const val = typed;
  hiddenInput.value=''; typed='';
  lockPromptAsHistory();
  if(awaitingResolve){
    const resolve = awaitingResolve;
    awaitingResolve = null;
    resolve(val);
    return;
  }
  const cmd = val.trim();
  if(cmd) echoYou(cmd);
  dispatchTopLevel(cmd);
}

async function askText(question, marker){
  const val = await new Promise(resolve=>{
    if(question) say(question);
    printPrompt(marker || `<span class="term-ask-marker">?</span>&nbsp;&nbsp;`);
    awaitingResolve = (v)=>{ record('you', v); resolve(v); };
  });
  if(val.trim().toLowerCase()==='cancel') throw new FlowCancel();
  return val;
}
async function askYesNo(question){
  while(true){
    const a = (await askText(question + '  (y/n)')).trim().toLowerCase();
    if(['y','yes'].includes(a)) return true;
    if(['n','no'].includes(a)) return false;
    sayErr("please type 'y' or 'n' (or 'cancel').");
  }
}
function askFile(accept){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className = 'term-line';
    wrap.innerHTML = `<div class="term-filedrop">[ tap to select file ]<input type="file" accept="${accept}"></div>`;
    termBody.appendChild(wrap);
    scrollBottom();
    const inp = wrap.querySelector('input');
    inp.addEventListener('change', ()=>{
      const f = inp.files[0] || null;
      wrap.innerHTML = `<span class="dim">[file] ${f?escapeHtml(f.name):'(cancelled)'}</span>`;
      resolve(f);
    });
  });
}
function spinner(label){
  const div = printRaw(`<span class="dim">${escapeHtml(label)} <span id="spinFrame">⠋</span></span>`, '');
  const frames=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
  let i=0;
  const iv = setInterval(()=>{ const el=div.querySelector('#spinFrame'); if(el){ i=(i+1)%frames.length; el.textContent=frames[i]; } }, 90);
  return { stop(finalHtml, cls){ clearInterval(iv); div.className='term-line'+(cls?(' '+cls):''); div.innerHTML=finalHtml; scrollBottom(); } };
}

/* ══════════════════════════════════════════════════════════
   SESSION HISTORY (localStorage, replayable via `history`/`open`)
   ══════════════════════════════════════════════════════════ */
function saveSession(){
  const all = LS.get('sessions', {});
  const firstYou = currentTranscript.find(t=>t.tag==='you');
  all[sessionId] = { id: sessionId, title: firstYou ? firstYou.text.slice(0,44) : 'session', updatedAt: Date.now(), transcript: currentTranscript };
  const trimmed = Object.values(all).sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,40);
  const trimmedMap = {}; trimmed.forEach(s=>trimmedMap[s.id]=s);
  LS.set('sessions', trimmedMap);
}
function listSessions(){
  const all = LS.get('sessions', {});
  return Object.values(all).sort((a,b)=>b.updatedAt-a.updatedAt);
}

/* ══════════════════════════════════════════════════════════
   FLOW: RANK PREDICTION
   ══════════════════════════════════════════════════════════ */
async function runRankFlow(){
  say("let's estimate your KCET rank.");
  const boardsRaw = await askText("2nd PU boards — type a percentage (91), total marks (274), or subject marks like 88,92,95:");
  const boardsPct = parseScoreInput(boardsRaw, 300, 100, 'percentage');
  if(boardsPct==null){ sayErr("couldn't read that score."); return runRankFlow(); }
  const kcetRaw = await askText("KCET score — percentage, marks out of 180, or subject marks like 55,58,52:");
  const kcetPct = parseScoreInput(kcetRaw, 180, 60, 'marks');
  if(kcetPct==null){ sayErr("couldn't read that score."); return runRankFlow(); }
  const finalPct = computeFinalPercentage(boardsPct, kcetPct);
  const rank = kcetEngine.predictRank(finalPct);
  sayTable(
`boards       ${boardsPct.toFixed(1)}%
kcet         ${kcetPct.toFixed(1)}%
combined     ${finalPct.toFixed(1)}%
-----------------------------------
estimated rank   ${rank.toLocaleString('en-IN')}`
  );
  const wantsCollege = await askYesNo("look up eligible colleges for this rank now?");
  if(wantsCollege) await runCollegeFlow({ rank });
}

/* ══════════════════════════════════════════════════════════
   FLOW: COLLEGE PREDICTION
   ══════════════════════════════════════════════════════════ */
async function runCollegeFlow(prefill){
  prefill = prefill || {};
  const dsRaw = await askText("dataset — [1] Engineering  [2] Engineering (HK):");
  const dataset = dsRaw.trim()==='2' || /hk/i.test(dsRaw) ? 'enghk' : 'eng';
  const cats = dataset==='enghk' ? HK_CATEGORIES : GENERAL_CATEGORIES;

  let category;
  while(true){
    const catRaw = (await askText(`category code (e.g. GM, 1G, 2AG…) — type 'list' to see all ${cats.length}:`)).trim().toUpperCase();
    if(catRaw==='LIST'){ sayDim(cats.join('  ')); continue; }
    if(cats.includes(catRaw)){ category = catRaw; break; }
    sayErr(`'${escapeHtml(catRaw)}' isn't valid for this dataset. try again, or 'list'.`);
  }

  let rank = prefill.rank;
  if(rank){ say(`using rank ${rank.toLocaleString('en-IN')} from earlier.`); }
  else{
    while(true){
      const r = await askText("your KCET rank:");
      rank = parseInt(r.replace(/,/g,''),10);
      if(!isNaN(rank) && rank>0) break;
      sayErr("enter a valid whole number.");
    }
  }

  const sp1 = spinner('loading branch list…');
  let aliases = [];
  try{ aliases = await loadBranchAliases(); sp1.stop('<span class="dim">branch list ready.</span>'); }
  catch(e){ sp1.stop(`<span class="err">couldn't load branch-aliases.json (${escapeHtml(e.message)}).</span>`,'err'); }

  let selected = null;
  while(!selected){
    const branchRaw = (await askText("branch — e.g. 'computer science', 'mechanical', 'ece':")).trim().toLowerCase();
    if(!branchRaw){ sayErr("type a branch keyword."); continue; }
    const matches = aliases.filter(en => en.display_name.toLowerCase().includes(branchRaw) || (en.aliases||[]).some(a=>a.toLowerCase().includes(branchRaw))).slice(0,8);
    if(!matches.length){ sayErr("no matching branch — try a different keyword."); continue; }
    if(matches.length===1){ selected = matches[0]; say(`matched: ${escapeHtml(selected.display_name)}`); break; }
    sayDim(matches.map((m,i)=>`  [${i+1}] ${m.display_name}`).join('\n'));
    const pick = await askText("pick a number:");
    const idx = parseInt(pick,10)-1;
    if(matches[idx]) selected = matches[idx]; else sayErr("invalid choice.");
  }

  const sp2 = spinner(`searching ${dataset==='enghk'?'Engineering (HK)':'Engineering'} colleges…`);
  try{
    const data = await loadDataset(dataset);
    sp2.stop('<span class="dim">dataset ready.</span>');
    const aliasPool = [selected.display_name, ...(selected.aliases||[])];
    printCollegeResults(data, category, rank, aliasPool, selected.display_name);
  }catch(e){
    sp2.stop(`<span class="err">couldn't load dataset (${escapeHtml(e.message)}).</span>`,'err');
  }
}

function printCollegeResults(dataset, category, rank, aliasPool, branchLabel){
  const lowerBound = rank - 1500;
  const results = [];
  for(const college of dataset){
    if(!college.branches) continue;
    const key = matchBranchKey(aliasPool, college.branches);
    if(!key) continue;
    const cutoff = college.branches[key][category];
    if(cutoff==null) continue;
    if(cutoff >= lowerBound) results.push({ id:college.id, name:getShortName(college.name), location:college.location||'Karnataka', branch:key, cutoff, dist:Math.abs(cutoff-rank) });
  }
  results.sort((a,b)=>a.dist-b.dist);
  if(!results.length){ sayWarn(`no eligible colleges found for ${escapeHtml(branchLabel)} · ${category} near rank ${rank.toLocaleString('en-IN')}.`); lastResults=null; return; }
  lastResults = { kind:'college', results, category, meta:`${branchLabel} · ${category} · rank ${rank.toLocaleString('en-IN')}` };
  renderCollegeTable(results.slice(0,12), results.length, `${results.length} matches · ${branchLabel} · ${category} · rank ${rank.toLocaleString('en-IN')}`);
}
function renderCollegeTable(rows, totalCount, headerLine){
  const idW=6, nameW=40, cutW=8;
  let out = headerLine + '\n\n';
  out += pad('ID',idW)+' '+pad('COLLEGE',nameW)+' '+padS('CUTOFF',cutW)+'  LOCATION\n';
  out += '-'.repeat(idW)+' '+'-'.repeat(nameW)+' '+'-'.repeat(cutW)+'  '+'-'.repeat(10)+'\n';
  rows.forEach(r=>{
    out += pad(r.id,idW)+' '+pad(r.name.slice(0,nameW),nameW)+' '+padS(r.cutoff.toLocaleString('en-IN'),cutW)+'  '+r.location+'\n';
  });
  if(totalCount>rows.length) out += `\n… +${totalCount-rows.length} more — type 'more' to see all`;
  sayTable(out.trimEnd());
}
function showMoreResults(){
  if(!lastResults){ sayWarn("nothing to expand — run 'rank', 'college' or 'priority' first."); return; }
  if(lastResults.kind==='college'){ renderCollegeTable(lastResults.results, lastResults.results.length, `all ${lastResults.results.length} matches · ${lastResults.meta}`); }
  else if(lastResults.kind==='priority'){ renderPriorityTable(lastResults.results, lastResults.results.length, `all ${lastResults.results.length} eligible options`); }
}

/* ══════════════════════════════════════════════════════════
   SMART FREEFORM CHAT
   ══════════════════════════════════════════════════════════ */
let pendingSmartQuery = null;

async function searchCollegesSmart({ rank, category, branch, location }){
  const dataset = await loadDataset(HK_CATEGORIES.includes(category) ? 'enghk' : 'eng');
  const lowerBound = rank - 1500;
  const branchAliasPool = branch ? [branch] : null;
  const results = [];
  for(const college of dataset){
    if(location && !(college.location||'').toLowerCase().includes(location.toLowerCase())) continue;
    if(!college.branches) continue;
    if(branchAliasPool){
      const key = matchBranchKey(branchAliasPool, college.branches);
      if(!key) continue;
      const cutoff = college.branches[key][category];
      if(cutoff==null || cutoff < lowerBound) continue;
      results.push({ id:college.id, name:getShortName(college.name), location:college.location||'Karnataka', branch:key, cutoff, dist:Math.abs(cutoff-rank) });
    } else {
      let bestKey=null, bestCutoff=null, bestDist=Infinity;
      for(const [bkey, cd] of Object.entries(college.branches)){
        const cutoff = cd[category];
        if(cutoff==null || cutoff < lowerBound) continue;
        const dist = Math.abs(cutoff-rank);
        if(dist < bestDist){ bestDist=dist; bestKey=bkey; bestCutoff=cutoff; }
      }
      if(bestKey) results.push({ id:college.id, name:getShortName(college.name), location:college.location||'Karnataka', branch:bestKey, cutoff:bestCutoff, dist:bestDist });
    }
  }
  results.sort((a,b)=>a.dist-b.dist);
  return results;
}

async function handleSmartMessage(rawText){
  const sp = spinner('thinking…');
  await sleep(700);

  let entities = extractEntities(rawText);
  if(pendingSmartQuery){
    const merged = Object.assign({}, pendingSmartQuery.known, entities);
    if(!merged.category){ const c = extractCategoryOnly(rawText); if(c) merged.category = c; }
    entities = merged;
  }

  const looksKcetRelated = entities.kcetMarks!=null || entities.boardPercentage!=null || entities.rank!=null ||
    entities.category || entities.branch || /\b(kcet|cet|rank|board|puc?)\b/i.test(rawText) || !!pendingSmartQuery;

  if(looksKcetRelated){ sp.stop(''); await routeKcetQuery(entities); return; }

  const chatGuess = classifyChat(rawText);
  if(chatGuess){ sp.stop(''); say(escapeHtml(chatGuess.output)); return; }

  sp.stop('');
  say(`I can help with rank prediction, college prediction, or matching your priority list — try <b>rank</b>, <b>college</b>, <b>priority</b>, or just tell me your boards % and KCET score together.`);
}

async function routeKcetQuery(entities){
  if(entities.rank==null && entities.kcetMarks!=null && entities.boardPercentage!=null){
    const kcetPct = (Math.min(180, entities.kcetMarks)/180)*100;
    const finalPct = computeFinalPercentage(entities.boardPercentage, kcetPct);
    entities.rank = kcetEngine.predictRank(finalPct);
    say(`based on ${entities.boardPercentage.toFixed(1)}% boards and ${entities.kcetMarks} KCET marks, estimated rank is <b>${entities.rank.toLocaleString('en-IN')}</b>.`);
  }
  const wantsCollege = entities.category || entities.branch || entities.location;
  if(entities.rank==null){
    pendingSmartQuery = { known: entities };
    say("what's your KCET score (or boards % + KCET score) so I can estimate your rank?");
    return;
  }
  if(!wantsCollege){ pendingSmartQuery = null; return; }
  if(!entities.category){
    pendingSmartQuery = { known: entities };
    say(`rank ${entities.rank.toLocaleString('en-IN')} noted — which category should I check against (GM, 1G, 2AG, SC, ST…)?`);
    return;
  }
  pendingSmartQuery = null;
  const sp = spinner('searching colleges…');
  try{
    const results = await searchCollegesSmart(entities);
    if(!results.length){
      sp.stop(`<span class="warn">doesn't look likely${entities.branch?` for ${escapeHtml(entities.branch)}`:''}${entities.location?` in ${escapeHtml(entities.location)}`:''} at rank ${entities.rank.toLocaleString('en-IN')} (${entities.category}) — no eligible seats.</span>`,'warn');
      lastResults=null;
      return;
    }
    sp.stop('<span class="dim">done.</span>');
    lastResults = { kind:'college', results, category:entities.category, meta:`${entities.branch?entities.branch+' · ':''}${entities.category} · rank ${entities.rank.toLocaleString('en-IN')}` };
    renderCollegeTable(results.slice(0,10), results.length, `${results.length} matches · ${lastResults.meta}`);
  }catch(e){
    sp.stop(`<span class="err">couldn't load the college dataset (${escapeHtml(e.message)}).</span>`,'err');
  }
}

/* ══════════════════════════════════════════════════════════
   TOP-LEVEL SHELL — command dispatch + boot sequence
   ══════════════════════════════════════════════════════════ */
async function runFlow(fn){
  try{ await fn(); }
  catch(e){ if(e instanceof FlowCancel) say('cancelled.'); else { sayErr('unexpected error: '+escapeHtml(e.message||String(e))); } }
}

async function processTopLevel(cmdRaw){
  const cmd = cmdRaw.toLowerCase().replace(/\s+/g,' ').trim();
  if(!cmd){ printPrompt(); return; }

  if(cmd==='help'){
    sayDim('available commands:');
    sayDim('  rank        — predict your KCET rank');
    sayDim('  college     — predict eligible colleges');
    sayDim('  priority    — match your KEA priority-list PDF');
    sayDim('  more        — expand the last results table');
    sayDim('  history     — list past terminal sessions');
    sayDim('  open &lt;n&gt;    — replay a past session from history');
    sayDim('  new         — start a fresh session');
    sayDim('  theme default | theme matrix — switch color skin');
    sayDim('  whoami / ls / clear');
    sayDim('  or just type naturally, e.g. "91% boards 140 kcet predict my rank"');
    printPrompt(); return;
  }
  if(cmd==='rank'){ await runFlow(runRankFlow); printPrompt(); return; }
  if(cmd==='college'){ await runFlow(runCollegeFlow); printPrompt(); return; }
  if(cmd==='priority'){ await runFlow(runPriorityFlow); printPrompt(); return; }
  if(cmd==='more'){ showMoreResults(); printPrompt(); return; }
  if(cmd==='ls'){
    ['trainingset.json','trainingset1.json','branch-aliases.json','firstroundeng.js','firstroundenghk.js','manifest.json','logo.png'].forEach(f=>sayDim('  '+f));
    printPrompt(); return;
  }
  if(cmd==='whoami'){ sayDim(userName ? userName.toLowerCase().replace(/\s+/g,'_') : 'guest'); printPrompt(); return; }
  if(cmd==='clear'){ termBody.innerHTML=''; printPrompt(); return; }
  if(cmd==='history'){
    const sessions = listSessions();
    if(!sessions.length){ sayDim('no past sessions yet.'); printPrompt(); return; }
    sessions.slice(0,15).forEach((s,i)=>{
      const d = new Date(s.updatedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
      sayDim(`  [${i+1}] ${s.title}  (${d})`);
    });
    sayDim("type 'open &lt;n&gt;' to replay one.");
    printPrompt(); return;
  }
  if(cmd.startsWith('open ')){
    const n = parseInt(cmd.slice(5).trim(),10);
    const sessions = listSessions();
    const s = sessions[n-1];
    if(!s){ sayErr('no such session.'); printPrompt(); return; }
    sayDim(`── replaying: ${escapeHtml(s.title)} ──`);
    s.transcript.forEach(t=>{
      if(t.tag==='you') printRaw(`<span class="term-tag-you">you ›</span> ${escapeHtml(t.text)}`);
      else if(t.tag==='proton') printRaw(`<span class="term-tag-proton">proton ›</span> ${escapeHtml(t.text)}`);
      else printRaw(escapeHtml(t.text), 'dim');
    });
    sayDim('── end of replay ──');
    printPrompt(); return;
  }
  if(cmd==='new'){
    saveSession();
    termBody.innerHTML='';
    currentTranscript = [];
    sessionId = 's_' + Date.now();
    lastResults = null; pendingSmartQuery = null;
    say(`new session started${userName?`, ${escapeHtml(userName)}`:''}.`);
    printPrompt(); return;
  }
  if(cmd.startsWith('theme')){
    const skin = cmd.split(' ')[1];
    if(skin==='matrix' || skin==='default'){
      document.documentElement.setAttribute('data-skin', skin==='matrix'?'matrix':'');
      LS.set('skin', skin);
      sayOk(`theme set to ${skin}.`);
    } else {
      sayDim("usage: theme default | theme matrix");
    }
    printPrompt(); return;
  }

  await handleSmartMessage(cmdRaw);
  saveSession();
  printPrompt();
}

/* ── BOOT SEQUENCE — real imports, timed for real ── */
async function importStep(index, total, label, loaderFn){
  const line = printRaw(`[${String(index).padStart(2,'0')}/${String(total).padStart(2,'0')}] importing <b style="color:var(--fg-bright);">${label}</b>`, 'dim');
  const t0 = performance.now();
  try{
    await loaderFn();
    const ms = Math.round(performance.now()-t0);
    line.className='term-line ok';
    line.innerHTML = `[${String(index).padStart(2,'0')}/${String(total).padStart(2,'0')}] ${label} → OK <span class="dim">(${ms}ms)</span>`;
  }catch(e){
    const ms = Math.round(performance.now()-t0);
    line.className = 'term-line warn';
    line.innerHTML = `[${String(index).padStart(2,'0')}/${String(total).padStart(2,'0')}] ${label} → WARN <span class="dim">(${ms}ms — ${escapeHtml(e.message||'not found')})</span>`;
  }
  scrollBottom();
  await sleep(70 + Math.random()*70);
}

async function runImportSequence(){
  setBusy(true);
  printRaw('');
  say(`resolving package <b style="color:var(--fg-bright);">x-bit-proton-kea</b>…`);
  await sleep(240);
  sayDim('fetching module manifest from origin…');
  await sleep(260);

  const modules = [
    { label:'core/rank-engine.kcet',    fn: ()=>Promise.resolve() },
    { label:'data/trainingset.json',    fn: ()=>loadTrainingData() },
    { label:'data/branch-aliases.json', fn: ()=>loadBranchAliases() },
    { label:'data/firstroundeng.js',    fn: ()=>loadDataset('eng') },
    { label:'data/firstroundenghk.js',  fn: ()=>loadDataset('enghk') },
    { label:'assets/manifest.json',     fn: ()=>fetch('./manifest.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); }) },
  ];
  for(let i=0;i<modules.length;i++) await importStep(i+1, modules.length, modules[i].label, modules[i].fn);

  await sleep(180);
  printRaw('');
  sayDim('linking modules… <span style="color:var(--ok);">done</span>');
  await sleep(160);
  sayDim('compiling shell… <span style="color:var(--ok);">done</span>');
  await sleep(220);
  printRaw('');
  printRaw(`<pre class="term-banner">██╗  ██╗      ██████╗ ██╗████████╗
╚██╗██╔╝      ██╔══██╗██║╚══██╔══╝
 ╚███╔╝ █████╗ ██████╔╝██║   ██║
 ██╔██╗ ╚════╝ ██╔══██╗██║   ██║
██╔╝ ██╗       ██████╔╝██║   ██║
╚═╝  ╚═╝       ╚═════╝ ╚═╝   ╚═╝  PROTON</pre>`);
  await sleep(150);
  sayHl(`x-bit-proton-kea imported successfully. <span style="color:var(--ok);">✓</span>`);
  await sleep(300);
  setBusy(false);
  await startRepl();
}

async function startRepl(){
  if(!userName){
    const n = (await askText("what's your name?")).trim();
    userName = n || 'guest';
    LS.set('username', userName);
  }
  const hr = new Date().getHours();
  const greet = hr<12?'good morning':hr<17?'good afternoon':'good evening';
  say(`hey ${escapeHtml(userName)}, ${greet}. type <b>help</b> to see what I can do, or just tell me your scores.`);
  printPrompt();
}

/* ── shell entry: require the import command before anything else runs ── */
let protonBooted = false;
async function dispatchTopLevel(cmdRaw){
  const cmd = cmdRaw.toLowerCase().replace(/\s+/g,' ').trim();
  if(!protonBooted){
    if(cmd === 'import x-bit-proton-kea' || cmd === 'import x-bit-proton-kea;'){
      protonBooted = true;
      await runImportSequence();
      return;
    }
    if(cmd === 'help'){
      sayDim('type:');
      sayDim('  import x-bit-proton-kea');
      sayDim('to boot the app. other commands unlock after import.');
      printPrompt(); return;
    }
    if(cmd === 'clear'){ termBody.innerHTML=''; printPrompt(); return; }
    if(!cmd){ printPrompt(); return; }
    sayErr(`bash: ${escapeHtml(cmdRaw)}: command not found`);
    sayDim(`try <b style="color:var(--fg-mid);">import x-bit-proton-kea</b> or <b style="color:var(--fg-mid);">help</b>`);
    printPrompt();
    return;
  }
  return processTopLevel(cmdRaw);
}
function bootPrompt(){
  const skin = LS.get('skin', 'default');
  if(skin==='matrix') document.documentElement.setAttribute('data-skin','matrix');
  printPrompt();
}
hiddenInput.disabled = false;
bootPrompt();

function setVH(){
  const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
  document.documentElement.style.setProperty('--vh', vh + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', ()=>setTimeout(setVH,100));
if(window.visualViewport){ window.visualViewport.addEventListener('resize', setVH); window.visualViewport.addEventListener('scroll', setVH); }

function tickClock(){
  const el = document.getElementById('termClock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 15000);

window.addEventListener('beforeunload', saveSession);
